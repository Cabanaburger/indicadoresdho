  --bg: #F7F1E1;
  --superficie: #FFFFFF;
  --borda: #EAE7DE;
  --borda-forte: #DAD5C7;
  --texto: #20261F;
  --texto-suave: #75796F;
  --texto-fraco: #A3A79B;

  --status-ativo: var(--cb-verde);
  --status-aguardando: var(--cb-dourado);
  --status-indisponivel: var(--cb-laranja);

  --fonte-display: 'Cooper Black', Georgia, 'Times New Roman', serif;
  --fonte-corpo: 'Avenir Next', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;

  --raio: 12px;
  --raio-grande: 18px;
  --sombra-hover: 0 8px 24px rgba(32, 38, 31, 0.08);
  --transicao: 150ms cubic-bezier(0.2, 0, 0, 1);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

body {
  margin: 0;
  font-family: var(--fonte-corpo);
  color: var(--texto);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  position: relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: var(--pattern-tile);
  background-repeat: repeat;
  background-size: 170px 170px;
  opacity: 0.05;
  pointer-events: none;
  z-index: 0;
}
.app-shell { position: relative; z-index: 1; }

code { background: var(--cb-verde-suave); padding: 1px 6px; border-radius: 4px; font-size: 0.9em; }

/* ---------------------------------------------------------------------- */
/* Shell: sidebar + área principal                                        */
/* ---------------------------------------------------------------------- */

.app-shell { display: flex; min-height: 100vh; }

.sidebar {
  width: 208px;
  flex-shrink: 0;
  background: var(--cb-verde);
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand { padding: 4px 6px 24px; }
.sidebar-logo {
  width: 100%; max-width: 190px; height: 36px;
  background-image: var(--logo-branco);
  background-size: contain; background-repeat: no-repeat; background-position: left center;
}
.sidebar-brand .brand-sub { display: block; font-size: 10.5px; color: rgba(255,255,255,0.55); letter-spacing: 0.12em; text-transform: uppercase; margin-top: -2px; }
.sidebar-brand .brand-produto { display: block; font-size: 12.5px; font-weight: 700; color: var(--cb-dourado); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 10px; }

.sidebar-nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }

.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,0.68);
  font-family: var(--fonte-corpo);
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  text-align: left;
  transition: background var(--transicao), color var(--transicao);
}
.nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
.nav-textos { display: flex; flex-direction: column; line-height: 1.3; }
.nav-titulo { font-size: 13.5px; font-weight: 600; }
.nav-sub { font-size: 10.5px; color: rgba(255,255,255,0.5); }
.nav-link:hover { background: rgba(255,255,255,0.08); color: #fff; }
.nav-link.is-active { background: #fff; color: var(--cb-verde-escuro); }
.nav-link.is-active .nav-sub { color: var(--texto-suave); }

.sidebar-footer { padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.12); }
.sidebar-btn {
  width: 100%;
  display: flex; align-items: center; gap: 8px; justify-content: center;
  font-family: var(--fonte-corpo);
  font-size: 12.5px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 8px;
  padding: 10px 10px;
  cursor: pointer;
  transition: background var(--transicao);
}
.sidebar-btn:hover { background: rgba(255,255,255,0.16); }

.app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---------------------------------------------------------------------- */
/* Topbar fino                                                            */
/* ---------------------------------------------------------------------- */

.topbar-slim {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 32px;
  border-bottom: 1px solid var(--borda);
  background: var(--superficie);
  position: sticky;
  top: 0;
  z-index: 15;
}

.filtro-periodo { display: flex; align-items: center; gap: 8px; }
.filtro-periodo select {
  font-family: var(--fonte-corpo);
  font-size: 13px;
  font-weight: 600;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--borda);
  color: var(--texto);
  background: var(--superficie);
  transition: border-color var(--transicao);
}
.filtro-periodo select:hover { border-color: var(--borda-forte); }

.status-dados { font-size: 12.5px; color: var(--texto-fraco); margin-left: auto; }

.btn {
  font-family: var(--fonte-corpo);
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  padding: 9px 16px;
  border: 1px solid transparent;
  cursor: pointer;
  transition: background var(--transicao), transform 80ms ease;
}
.btn:active { transform: scale(0.97); }
.btn-primario { background: var(--texto); color: #fff; }
.btn-primario:hover { background: var(--cb-verde-escuro); }
.btn-secundario { background: var(--superficie); color: var(--texto); border-color: var(--borda); }
.btn-secundario:hover { background: var(--bg); }
.btn-grande { padding: 13px 24px; font-size: 14.5px; }
.btn-fechar { background: transparent; color: var(--texto-suave); border: 1px solid var(--borda); }

/* ---------------------------------------------------------------------- */
/* Estado vazio (hero)                                                    */
/* ---------------------------------------------------------------------- */

.estado-vazio {
  margin: 64px auto;
  max-width: 640px;
  text-align: center;
  padding: 12px 32px;
}

.estado-vazio h1 {
  font-family: var(--fonte-display);
  font-size: 32px;
  line-height: 1.3;
  color: var(--texto);
  margin: 0 0 16px;
}
.estado-vazio .destaque { color: var(--cb-verde); }
.estado-vazio p { color: var(--texto-suave); font-size: 14.5px; line-height: 1.7; margin-bottom: 26px; }

/* ---------------------------------------------------------------------- */
/* Resumo de execução (barra fina com contadores estruturais)             */
/* ---------------------------------------------------------------------- */

.resumo-execucao {
  margin: 0;
  padding: 12px 32px;
  display: flex;
  gap: 28px;
  border-bottom: 1px solid var(--borda);
  background: var(--superficie);
}

.resumo-item { display: flex; align-items: baseline; gap: 6px; }
.resumo-item .numero { font-family: var(--fonte-corpo); font-weight: 700; font-size: 14px; color: var(--texto); }
.resumo-item .rotulo { font-size: 12px; color: var(--texto-fraco); }
.resumo-item.alerta .numero { color: var(--cb-laranja); }
.resumo-item.espera .numero { color: var(--cb-dourado); }
.resumo-item.periodo { margin-right: auto; }
.resumo-item.periodo .numero { font-family: var(--fonte-display); font-size: 15px; color: var(--cb-verde-escuro); }

/* ---------------------------------------------------------------------- */
/* Grade de indicadores                                                   */
/* ---------------------------------------------------------------------- */

.grade-indicadores { padding: 32px; max-width: 1600px; }

.categoria-titulo {
  font-family: var(--fonte-display);
  font-size: 22px;
  color: var(--texto);
  margin: 0 0 6px;
}

.categoria-descricao {
  color: var(--texto-suave);
  font-size: 13.5px;
  max-width: 760px;
  margin: 0 0 28px;
  line-height: 1.65;
}

.cartoes {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  grid-auto-flow: dense;
  align-items: start;
  gap: 16px;
  margin-bottom: 8px;
}

.grupo-dho-titulo {
  grid-column: 1 / -1;
  font-family: var(--fonte-display);
  font-size: 15px;
  color: var(--texto-suave);
  margin: 18px 0 -4px;
  padding-top: 14px;
  border-top: 1px solid var(--borda);
}
.grupo-dho-titulo:first-child { margin-top: 0; padding-top: 0; border-top: none; }

.cartao-indicador {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow var(--transicao), border-color var(--transicao), transform var(--transicao);
}
.cartao-indicador:hover { box-shadow: var(--sombra-hover); border-color: var(--borda-forte); transform: translateY(-1px); }

.cartao-indicador.tem-grafico { grid-column: span 2; }
.cartao-indicador.tem-grafico-largo { grid-column: 1 / -1; }
.cartao-indicador.tem-tabela { grid-column: 1 / -1; }
.cartao-indicador.tem-cartoes-pesquisa { grid-column: 1 / -1; }

/* DHO tem vários cabeçalhos de seção dentro da mesma grade, com
   grid-auto-flow: dense, um card pequeno de uma seção de baixo podia ser
   puxado pra um buraco de uma linha ANTES do cabeçalho (bug apontado pela
   Nayuri em 01/09: cards de NPS aparecendo acima do título da própria
   seção). Nessa página específica, desliga o dense: cada card respeita a
   ordem em que entra, mesmo que sobre um pedacinho de espaço vazio. */
.cartoes.cartoes-sem-dense { grid-auto-flow: row; }

/* R&S teve muito card branco simples (Vagas Canceladas, Congeladas, SLA de
   Vagas, etc), pedido da Nayuri (01/09): quer tudo na mesma linha, então
   cards mais estreitos e com menos respiro, cabe mais por linha. */
.cartoes.cartoes-compactas { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; align-items: stretch; }
.cartoes.cartoes-compactas .cartao-indicador { padding: 14px 16px; }
.cartoes.cartoes-compactas .cartao-nome { font-size: 11.5px; }
.cartoes.cartoes-compactas .cartao-valor { font-size: 26px; }
.cartoes.cartoes-compactas .cartao-auditoria { margin-top: auto; }
@media (max-width: 720px) { .cartao-indicador.tem-grafico { grid-column: span 1; } }

.cartao-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.cartao-nome { font-size: 12.5px; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.03em; }

.selo-status {
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 3px 9px;
  border-radius: 999px;
  white-space: nowrap;
}
.selo-status.ativo { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.selo-status.aguardando_dados { background: #FDF1D6; color: #8A6400; }
.selo-status.indisponivel { background: #FBE3DA; color: #A5401D; }

.cartao-valor { font-family: var(--fonte-display); font-size: 30px; color: var(--texto); letter-spacing: -0.01em; }
.cartao-valor.valor-indisponivel { font-family: var(--fonte-corpo); font-size: 14px; color: var(--texto-fraco); font-weight: 600; }
.cartao-valor.cartao-valor-com-nota { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cartao-nota-inline { font-family: var(--fonte-corpo); font-size: 11px; font-weight: 400; color: var(--texto-fraco); font-style: italic; }

.cartao-observacao { font-size: 12px; color: var(--texto-fraco); line-height: 1.55; margin: 0; }
.cartao-delta-mes { font-size: 12.5px; font-weight: 700; margin: 0; }

.lista-distribuicao { margin: 0; padding: 0; list-style: none; font-size: 13px; }
.lista-distribuicao li { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid var(--bg); }
.lista-distribuicao li:last-child { border-bottom: none; }
.lista-distribuicao li span:last-child { font-weight: 600; color: var(--texto); }

.grafico-container { position: relative; height: 240px; margin: 2px 0; }
.grafico-container.grafico-linha { height: 340px; }

.cartao-auditoria { margin-top: auto; padding-top: 4px; }
.cartao-auditoria summary { font-size: 11.5px; color: var(--cb-azul); cursor: pointer; font-weight: 600; }
.cartao-auditoria-corpo { font-size: 12px; color: var(--texto-suave); margin-top: 8px; line-height: 1.6; }
.cartao-auditoria-corpo dt { font-weight: 700; color: var(--texto); }
.cartao-auditoria-corpo dd { margin: 0 0 6px; }

/* ---------------------------------------------------------------------- */
/* Visão Geral / Resumo Executivo (a "home", precisa impressionar)       */
/* ---------------------------------------------------------------------- */

.hero-periodo {
  position: relative;
  overflow: hidden;
  background: var(--cb-verde);
  border-radius: var(--raio-grande);
  padding: 18px 28px;
  color: #fff;
  margin-bottom: 20px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
}
.hero-periodo::after {
  content: '';
  position: absolute;
  top: 50%;
  right: -40px;
  width: 140px;
  height: 140px;
  transform: translateY(-50%);
  background-image: var(--marca-dagua);
  background-size: contain;
  background-repeat: no-repeat;
  opacity: 0.14;
  pointer-events: none;
}
.hero-periodo-rotulo, .hero-periodo-titulo, .hero-periodo-sub { position: relative; z-index: 1; }
.hero-periodo-rotulo { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.75); margin-bottom: 0; }
.hero-periodo-titulo { font-family: var(--fonte-display); font-size: 24px; margin: 0; }
.hero-periodo-sub { font-size: 12.5px; color: rgba(255,255,255,0.85); margin: 0; }

.visao-geral-nota {
  background: var(--cb-verde-suave);
  color: var(--cb-verde-escuro);
  font-size: 13px;
  padding: 10px 16px;
  border-radius: 10px;
  display: inline-block;
  margin-bottom: 20px;
}

.visao-geral-area-titulo {
  font-family: var(--fonte-display);
  font-size: 22px;
  color: var(--texto);
  margin: 40px 0 4px;
  padding-top: 24px;
  border-top: 1px solid var(--borda);
}
.visao-geral-area-titulo:first-of-type { margin-top: 28px; padding-top: 0; border-top: none; }

.visao-geral-subtitulo {
  font-family: var(--fonte-corpo);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--cb-verde);
  margin: 16px 0 12px;
}
.visao-geral-titulo-secao {
  font-family: var(--fonte-display);
  font-size: 17px;
  color: var(--texto);
  margin: 26px 0 12px;
  padding-top: 18px;
  border-top: 1px solid var(--borda);
}
.visao-geral-titulo-secao:first-of-type { margin-top: 6px; padding-top: 0; border-top: none; }

.cartoes-resumo { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); align-items: stretch; }

.cartao-resumo {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: box-shadow var(--transicao), transform var(--transicao);
}
.cartao-resumo:hover { box-shadow: var(--sombra-hover); transform: translateY(-1px); }
.cartao-resumo-icone {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 17px;
}
.cartao-resumo-corpo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cartao-resumo-rotulo { font-size: 11px; font-weight: 700; color: var(--texto-fraco); text-transform: uppercase; letter-spacing: 0.03em; }
.cartao-resumo-valor { font-family: var(--fonte-display); font-size: 26px; color: var(--texto); line-height: 1.1; }
.cartao-resumo-valor.valor-indisponivel { font-family: var(--fonte-corpo); font-size: 13px; color: var(--texto-fraco); }
.cartao-resumo-variacao { font-size: 11px; font-weight: 700; width: fit-content; padding: 2px 8px; border-radius: 999px; }
.cartao-resumo-variacao.sobe { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.cartao-resumo-nota { font-size: 9.5px; color: var(--texto-fraco); font-style: italic; line-height: 1.3; margin-top: 2px; }
.cartao-resumo-variacao.desce { background: #FBE3DA; color: #A5401D; }

.grafico-comparativo-container { height: 300px; margin-top: 10px; }

.visao-geral-legenda { color: var(--texto-suave); font-size: 13.5px; margin: -4px 0 16px; }
.bloco-destaque-treinamentos { margin-bottom: 28px; }

/* ---------------------------------------------------------------------- */
/* Book de Metas, Diretoria                                              */
/* ---------------------------------------------------------------------- */

.book-metas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
  margin-bottom: 32px;
}

.book-meta-card {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-left: 5px solid var(--borda-forte);
  border-radius: var(--raio);
  padding: 18px 20px;
}
.book-meta-card.batida { border-left-color: var(--cb-verde); }
.book-meta-card.nao-batida { border-left-color: var(--cb-laranja); }
.book-meta-card.pendente { border-left-color: var(--borda); }

.book-meta-cabecalho { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
.book-meta-nome { font-family: var(--fonte-display); font-size: 15px; color: var(--texto); }
.book-meta-status { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.book-meta-card.batida .book-meta-status { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.book-meta-card.nao-batida .book-meta-status { background: #FBE3DA; color: #A5401D; }
.book-meta-card.pendente .book-meta-status { background: var(--bg); color: var(--texto-fraco); }

.book-meta-corpo { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.book-meta-numero { font-family: var(--fonte-display); font-size: 32px; color: var(--texto); }
.book-meta-unidade { font-size: 13px; color: var(--texto-suave); }

.book-meta-detalhe { font-size: 11.5px; color: var(--texto-fraco); margin: 0; }
.book-meta-obs { font-size: 11.5px; color: var(--cb-dourado); font-style: italic; margin: 6px 0 0; }
.book-meta-variacao { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-left: 4px; }
.book-meta-variacao.favoravel { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.book-meta-variacao.desfavoravel { background: #FBE3DA; color: #A5401D; }

/* ---------------------------------------------------------------------- */
/* Pesquisa de Jornada                                                    */
/* ---------------------------------------------------------------------- */

.jornada-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 32px;
}
.jornada-caixa {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.jornada-caixa.placeholder { background: var(--bg); border-style: dashed; }
.jornada-titulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--texto-suave); }
.jornada-numero { font-family: var(--fonte-display); font-size: 28px; color: var(--texto); }
.jornada-sub { font-size: 10.5px; color: var(--texto-fraco); line-height: 1.4; }
.jornada-delta { font-size: 11.5px; font-weight: 700; }
.jornada-caixa.placeholder .jornada-sub { color: var(--cb-dourado); font-style: italic; }

/* ---------------------------------------------------------------------- */
/* Cards consolidados por área (Produção + Resultado + CTA)               */
/* ---------------------------------------------------------------------- */

.grade-areas-executivo {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
  margin: 32px 0;
}

.area-card-executivo {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-top: 4px solid var(--cor-area, var(--cb-verde));
  border-radius: var(--raio);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.area-card-cabecalho { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.area-card-icone {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--cor-area, var(--cb-verde));
  color: #fff; font-size: 13px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.area-card-cabecalho h3 { font-family: var(--fonte-display); font-size: 16px; margin: 0; color: var(--texto); }

.area-card-secao h4 {
  font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--cor-area, var(--cb-verde)); margin: 12px 0 8px;
}

.area-card-lista { list-style: none; margin: 0; padding: 0; }
.area-card-lista li {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 13px; padding: 7px 0; border-bottom: 1px solid var(--bg);
}
.area-card-lista li:last-child { border-bottom: none; }
.area-card-lista li > span:first-child { color: var(--texto-suave); }
.area-card-valor-linha { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--texto); }
.area-card-variacao { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
.area-card-variacao.sobe { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.area-card-variacao.desce { background: #FBE3DA; color: #A5401D; }

.area-card-cta {
  margin-top: 16px;
  align-self: flex-start;
  background: var(--cor-area-clara, var(--cb-verde-suave));
  border: none;
  border-radius: 999px;
  color: var(--cor-area, var(--cb-verde));
  font-family: var(--fonte-corpo);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  padding: 9px 16px;
}
.area-card-cta:hover { text-decoration: underline; }

.mini-stats-nps { display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 8px; margin-top: 4px; }
.mini-stat-nps {
  background: var(--bg);
  border: 1px solid var(--borda);
  border-radius: 10px;
  padding: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  text-align: center;
}
.mini-stat-rotulo { font-size: 9.5px; color: var(--texto-suave); line-height: 1.25; }
.mini-stat-valor { font-family: var(--fonte-display); font-size: 19px; }

.engajamento-linha {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--bg); border-radius: 10px; padding: 12px 14px;
}
.engajamento-valor { font-weight: 700; color: var(--texto); font-size: 13px; }
.engajamento-icone {
  width: 26px; height: 26px; border-radius: 50%; background: var(--cb-roxo);
  color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0;
}

/* ---------------------------------------------------------------------- */
/* Rodapé executivo: Entregas Estratégicas (timeline) + Destaques (painel) */
/* ---------------------------------------------------------------------- */

.grade-rodape-executivo {
  display: grid;
  grid-template-columns: 1.8fr 1fr;
  gap: 24px;
  align-items: start;
  margin-top: 8px;
}
@media (max-width: 980px) { .grade-rodape-executivo { grid-template-columns: 1fr; } }

.entregas-legenda { color: var(--texto-suave); font-size: 12.5px; margin: -4px 0 16px; }

/* ---------------------------------------------------------------------- */
/* Entregas Estratégicas, cards por projeto (substitui a timeline antiga). */
/* ---------------------------------------------------------------------- */

.projetos-grade {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
}
.projeto-card {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.projeto-cabecalho { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.projeto-nome { font-family: var(--fonte-display); font-size: 14px; color: var(--texto); margin: 0; }
.projeto-contagem { font-size: 10px; color: var(--texto-suave); white-space: nowrap; }
.projeto-resultado-esperado { font-size: 11px; color: var(--cb-verde-escuro); background: var(--cb-verde-suave); border-radius: 8px; padding: 6px 8px; margin: 0; line-height: 1.4; }
.projeto-resultado-esperado.projeto-resultado-vazio { color: var(--texto-fraco); background: var(--bg); font-style: italic; }

.projeto-secao { display: flex; flex-direction: column; gap: 6px; }
.projeto-secao-titulo { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--texto-suave); }
.projeto-secao-vazia { padding-top: 2px; }

.projeto-grupo-mes { display: flex; flex-direction: column; gap: 4px; }
.projeto-mes-rotulo {
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--cb-verde-escuro); background: var(--cb-verde-suave); width: fit-content;
  padding: 2px 7px; border-radius: 999px;
}
.projeto-bullets { margin: 2px 0 0; padding-left: 16px; }
.projeto-bullets li { font-size: 11.5px; color: var(--texto); line-height: 1.5; margin-bottom: 3px; }
.projeto-bullet-resp { color: var(--texto-fraco); font-size: 10.5px; }
.projeto-prazo { color: var(--texto-fraco); font-size: 10px; font-style: italic; }
.projeto-lista-suspensa summary {
  cursor: pointer; font-size: 12px; font-weight: 700; color: var(--cb-verde-escuro);
  background: var(--cb-verde-suave); padding: 7px 12px; border-radius: 999px; list-style: none;
  width: fit-content; transition: background var(--transicao), transform var(--transicao);
}
.projeto-lista-suspensa summary:hover { background: var(--cb-verde); color: #fff; transform: translateY(-1px); }
.projeto-lista-suspensa summary::-webkit-details-marker { display: none; }
.projeto-lista-suspensa summary::before { content: '▶ '; font-size: 9px; }
.projeto-lista-suspensa[open] summary::before { content: '▼ '; }
.projeto-lista-suspensa[open] summary { margin-bottom: 8px; }

.destaques-painel {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio);
  padding: 8px 18px;
}
.destaque-linha {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 0;
  border-bottom: 1px solid var(--bg);
}
.destaque-linha:last-child { border-bottom: none; }
.destaque-icone {
  width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff; margin-top: 1px;
}
.destaque-icone.sobe { background: var(--cb-verde); }
.destaque-icone.desce { background: var(--cb-laranja); }
.destaque-corpo { min-width: 0; }
.destaque-titulo { font-family: var(--fonte-display); font-size: 13.5px; color: var(--texto); display: block; margin-bottom: 3px; }
.destaque-texto { font-size: 12px; color: var(--texto-suave); line-height: 1.5; margin: 0; }

/* ---------------------------------------------------------------------- */
/* Mini-cartões de treinamento                                            */
/* ---------------------------------------------------------------------- */

.mini-cartoes-treino {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
  width: 100%;
}
.mini-cartoes-treino.mini-cartoes-uma-linha {
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
}
.mini-cartoes-treino.mini-cartoes-uma-linha .mini-cartao-treino { padding: 14px 12px; }
.mini-cartoes-treino.mini-cartoes-uma-linha .mini-cartao-cabecalho strong { font-size: 13px; }
.mini-cartoes-treino.mini-cartoes-uma-linha .stat-numero { font-size: 17px; }
.mini-cartoes-treino.mini-cartoes-uma-linha .stat-rotulo { font-size: 8px; }
.mini-cartoes-treino.mini-cartoes-uma-linha .mini-cartao-stats { gap: 6px 8px; }
@media (max-width: 900px) { .mini-cartoes-treino.mini-cartoes-uma-linha { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }

.mini-cartao-treino {
  background: var(--superficie);
  border: 1px solid var(--borda-forte);
  border-radius: 12px;
  padding: 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 1px 4px rgba(43,43,43,0.07);
  transition: box-shadow var(--transicao), border-color var(--transicao);
}
.mini-cartao-treino:hover { box-shadow: var(--sombra-hover); border-color: var(--borda-forte); }
.mini-cartao-treino.mini-cartao-total { background: var(--cb-verde-suave); border-color: transparent; }

.mini-cartao-cabecalho { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.mini-cartao-cabecalho strong { font-family: var(--fonte-display); font-size: 15px; color: var(--texto); line-height: 1.3; }
.mini-cartao-local { font-size: 11.5px; color: var(--texto-suave); margin: 2px 0 8px; }
.mini-cartao-obs { font-size: 11.5px; color: var(--texto-suave); font-style: italic; margin: -4px 0 8px; }

.mini-badge {
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em;
  padding: 3px 8px; border-radius: 999px; white-space: nowrap; color: #fff;
}
.mini-badge.treinamento { background: var(--cb-verde); }
.mini-badge.onboarding { background: var(--cb-dourado); color: var(--texto); }
.mini-badge.visita { background: var(--cb-azul); }
.mini-badge.total { background: var(--cb-verde-escuro); }

.mini-cartao-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(58px, 1fr)); gap: 12px 16px; }
.mini-cartao-stats > div { display: flex; flex-direction: column; min-width: 0; }
.mini-cartao-stats .stat-numero { font-family: var(--fonte-display); font-size: 20px; color: var(--texto); white-space: nowrap; }
.mini-cartao-stats .stat-rotulo { font-size: 9.5px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }

.mini-cartoes-compactas { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.mini-cartao-compacto { padding: 14px 16px; }
.mini-cartao-compacto .mini-cartao-cabecalho strong { font-size: 16px; }
.mini-cartao-compacto .mini-cartao-stats { gap: 10px 16px; margin-top: 10px; }
.mini-cartao-compacto .stat-numero { font-size: 22px; }
.mini-cartao-compacto .stat-rotulo { font-size: 10.5px; }

.mini-cartao-lojas { font-size: 12px; color: var(--texto-suave); line-height: 1.55; margin: 0; }
.mini-cartao-aviso { font-size: 11px; color: var(--cb-dourado); line-height: 1.45; margin: 2px 0 0; font-style: italic; }

.insights-card { margin-top: 16px; background: linear-gradient(180deg, var(--cb-verde-suave), var(--superficie) 40%); }
.insights-card-destaque { border: 2px solid var(--cb-dourado); box-shadow: 0 0 0 4px #FDF1D680; }

.destaque-satisfacao {
  background: linear-gradient(135deg, #FDF1D6, var(--superficie) 60%);
  border: 1px solid var(--cb-dourado);
  border-radius: var(--raio-grande);
  padding: 22px 26px;
  margin-bottom: 24px;
}
.destaque-satisfacao-selo {
  display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
  color: #8A6400; background: #fff; border: 1px solid var(--cb-dourado); border-radius: 999px; padding: 3px 10px; margin-bottom: 10px;
}
.destaque-satisfacao-titulo { font-family: var(--fonte-display); font-size: 19px; color: var(--texto); margin: 0 0 8px; }
.destaque-satisfacao-texto { font-size: 13.5px; color: var(--texto-suave); line-height: 1.6; margin: 0 0 12px; max-width: 780px; }
.insights-lista { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.insights-lista li {
  font-size: 13.5px; color: var(--texto); line-height: 1.6;
  padding-left: 18px; position: relative;
}
.insights-lista li::before { content: '→'; position: absolute; left: 0; color: var(--cb-verde); font-weight: 700; }
.insights-lista strong { color: var(--cb-verde-escuro); }

/* ---------------------------------------------------------------------- */
/* Prévia, selo usado nos blocos novos (Diário do Cabaneiro, Eventos      */
/* expandido, Kit de Onboarding) enquanto ainda não vêm de planilha.       */
/* ---------------------------------------------------------------------- */

.resumo-kpis-ci { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 4px 0 24px; }
.kpi-box { border-radius: var(--raio-grande); padding: 18px 20px; color: #fff; }
.kpi-box-valor { font-family: var(--fonte-display); font-size: 30px; display: block; line-height: 1.1; }
.kpi-box-rotulo { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; opacity: 0.9; }

/* ---------------------------------------------------------------------- */
/* Recrutamento & Seleção, resumo por analista/área (Administrativo x     */
/* Operações), acima da grade detalhada de sempre.                        */
/* ---------------------------------------------------------------------- */

.analista-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 28px; }
.analista-card { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio-grande); padding: 18px 20px; }
.analista-cabecalho { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.analista-selo { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.analista-nome { font-family: var(--fonte-display); font-size: 15px; color: var(--texto); }
.analista-sub { font-size: 11.5px; color: var(--texto-suave); }
.analista-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 12px; }
.analista-stat-valor { font-family: var(--fonte-display); font-size: 20px; color: var(--texto); display: block; }
.analista-stat-rotulo { font-size: 10px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.03em; }

/* ---------------------------------------------------------------------- */
/* Vagas Operacionais, nova guia (Extração Forms), estrutura pronta       */
/* aguardando dado real de setembro.                                      */
/* ---------------------------------------------------------------------- */

.vagas-op-aviso { background: var(--bg); border-radius: var(--raio); padding: 12px 16px; font-size: 12.5px; color: var(--texto-suave); margin-bottom: 16px; }
.vagas-op-blocos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 20px; }
.vagas-op-bloco { background: var(--superficie); border: 1px solid var(--borda); border-radius: var(--raio-grande); padding: 16px 18px; }
.vagas-op-bloco-titulo { font-size: 12px; font-weight: 700; color: var(--texto); margin: 0 0 4px; }
.vagas-op-bloco-valor { font-family: var(--fonte-display); font-size: 22px; color: var(--texto-fraco); }
.metas-sla-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.metas-sla-tabela th { text-align: left; padding: 8px 10px; color: var(--texto-suave); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--borda-forte); }
.metas-sla-tabela td { padding: 8px 10px; border-bottom: 1px solid var(--bg); }

.previa-selo {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
  color: #8A6400; background: #FDF1D6; border: 1px solid #F4DB9C;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}

/* ---------------------------------------------------------------------- */
/* Diário do Cabaneiro, cartão com estética de perfil de Instagram.       */
/* ---------------------------------------------------------------------- */

.ig-card {
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: var(--raio-grande);
  padding: 22px 24px;
  grid-column: 1 / -1;
}

.ig-topo { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
.ig-topo-esq { display: flex; align-items: center; gap: 14px; }

.ig-anel {
  width: 56px; height: 56px; border-radius: 50%; padding: 3px; flex-shrink: 0;
  background: linear-gradient(45deg, var(--cb-dourado), var(--cb-laranja), var(--cb-roxo));
  display: flex; align-items: center; justify-content: center;
}
.ig-avatar {
  width: 100%; height: 100%; border-radius: 50%; background: var(--superficie);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fonte-display); font-size: 20px; color: var(--cb-verde-escuro);
}

.ig-identidade-nome { font-family: var(--fonte-display); font-size: 16px; color: var(--texto); display: flex; align-items: center; gap: 6px; }
.ig-selo-verificado { color: var(--cb-azul); font-size: 13px; }
.ig-identidade-sub { font-size: 12px; color: var(--texto-suave); margin-top: 2px; }

.ig-stats { display: flex; gap: 28px; flex-wrap: wrap; }
.ig-stat { text-align: center; }
.ig-stat-valor { font-family: var(--fonte-display); font-size: 22px; color: var(--texto); display: block; }
.ig-stat-rotulo { font-size: 10.5px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.03em; }

.ig-fluxo { display: flex; gap: 14px; margin: 16px 0; flex-wrap: wrap; }
.ig-fluxo-chip { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; background: var(--bg); color: var(--texto-suave); }
.ig-fluxo-chip.entrou { color: var(--cb-verde-escuro); background: var(--cb-verde-suave); }
.ig-fluxo-chip.saiu { color: #A5401D; background: #FBE3DA; }
.ig-fluxo-chip b { font-family: var(--fonte-display); font-weight: 400; }

.ig-formatos { margin: 4px 0 16px; padding: 14px 16px; background: var(--bg); border-radius: var(--raio); }
.ig-formatos-titulo { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--texto-suave); margin-bottom: 10px; }
.ig-formato-linha { display: grid; grid-template-columns: 100px 1fr 26px; align-items: center; gap: 10px; padding: 4px 0; }
.ig-formato-nome { font-size: 12px; color: var(--texto); }
.ig-formato-barra-trilho { height: 8px; background: var(--superficie); border-radius: 999px; overflow: hidden; }
.ig-formato-barra { height: 100%; border-radius: 999px; }
.ig-formato-valor { font-size: 12px; font-weight: 700; color: var(--texto); text-align: right; }

.ig-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 4px; }
.ig-post {
  height: 110px; border-radius: 10px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; padding: 10px;
}
.ig-post-titulo {
  font-size: 12.5px; font-weight: 700; color: #fff; line-height: 1.28;
  text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.ig-post-curtidas { font-size: 11.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.4); align-self: flex-start; }
@media (max-width: 720px) { .ig-grid { grid-template-columns: repeat(2, 1fr); } .ig-post { height: 100px; } }

/* ---------------------------------------------------------------------- */
/* Eventos, destaque do próximo evento + tabela com linha expansível.     */
/* ---------------------------------------------------------------------- */

.evento-stats { display: flex; gap: 28px; flex-wrap: wrap; margin: 14px 0 4px; }
.evento-stat { text-align: center; }
.evento-stat-valor { font-family: var(--fonte-display); font-size: 22px; color: var(--texto); display: block; }
.evento-stat-rotulo { font-size: 10.5px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.03em; }

.evento-lista-real { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 4px; }
.evento-chip-real { font-size: 12px; padding: 5px 12px; border-radius: 999px; background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.evento-chip-real b { opacity: 0.5; font-weight: 400; }

.evento-divisor { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin: 20px 0 12px; padding-top: 16px; border-top: 1px solid var(--borda); }
.evento-divisor > span:first-child { font-family: var(--fonte-display); font-size: 14px; color: var(--texto); }

.evento-investimento { display: flex; gap: 24px; flex-wrap: wrap; }
.evento-investimento-item { display: flex; flex-direction: column; gap: 2px; }
.evento-investimento-rotulo { font-size: 10.5px; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.03em; }
.evento-investimento-valor { font-family: var(--fonte-display); font-size: 18px; color: var(--texto); }
.evento-posts-canal { display: flex; flex-direction: column; gap: 6px; }
.evento-desafio-item { padding: 10px 0; border-top: 1px solid var(--bg); }
.evento-desafio-item:first-child { border-top: none; padding-top: 0; }
.evento-desafio-titulo { font-size: 12.5px; font-weight: 700; color: var(--texto); margin: 0 0 4px; }

.evento-proximo {
  border: 1px solid var(--cb-roxo);
  background: linear-gradient(180deg, #F3E6F2, var(--superficie) 55%);
  border-radius: var(--raio-grande);
  padding: 18px 22px;
  grid-column: 1 / -1;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
}
.evento-proximo-selo { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--cb-roxo); background: #fff; border: 1px solid var(--cb-roxo); border-radius: 999px; padding: 3px 10px; }
.evento-proximo-nome { font-family: var(--fonte-display); font-size: 18px; color: var(--texto); margin: 6px 0 2px; }
.evento-proximo-data { font-size: 12.5px; color: var(--texto-suave); }

.evento-tabela-wrap { grid-column: 1 / -1; overflow-x: auto; }
.evento-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.evento-tabela th { text-align: left; padding: 8px 10px; color: var(--texto-suave); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--borda-forte); }
.evento-tabela td { padding: 9px 10px; border-bottom: 1px solid var(--bg); vertical-align: top; }
.evento-tabela tr.linha-evento { cursor: pointer; }
.evento-tabela tr.linha-evento:hover { background: var(--bg); }
.evento-nps { font-family: var(--fonte-display); }
.evento-invest-ok { color: var(--cb-verde-escuro); }
.evento-invest-estourou { color: var(--cb-laranja); }
.evento-detalhe-linha td { background: var(--cb-verde-suave); padding: 14px 18px; }
.evento-detalhe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.evento-detalhe-grid h5 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--cb-verde-escuro); }
.evento-detalhe-grid p { margin: 0; font-size: 12.5px; color: var(--texto); line-height: 1.5; }
@media (max-width: 720px) { .evento-detalhe-grid { grid-template-columns: 1fr; } }

/* ---------------------------------------------------------------------- */
/* Kit de Onboarding, cartão de status simples, sem números.              */
/* ---------------------------------------------------------------------- */

.kit-card { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
.kit-card-texto { max-width: 640px; }
.kit-card-estrategia { font-size: 13px; color: var(--texto); line-height: 1.6; margin: 4px 0 0; }
.kit-status-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
.kit-status-badge.em-cotacao { background: #FDF1D6; color: #8A6400; }
.kit-status-badge.em-producao { background: #E6F2F7; color: #08627A; }
.kit-status-badge.entregue { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.insights-subtitulo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--texto-fraco); margin: 18px 0 8px; padding-top: 14px; border-top: 1px dashed var(--borda); }
.mini-cartao-lojas strong { color: var(--texto); }

/* ---------------------------------------------------------------------- */
/* Funil (SVG custom)                                                     */
/* ---------------------------------------------------------------------- */

.funil-svg-container { width: 100%; height: 260px; }

/* ---------------------------------------------------------------------- */
/* Gauge (velocímetro) de NPS/L-NPS                                       */
/* ---------------------------------------------------------------------- */

.gauge-nps { display: flex; flex-direction: column; align-items: center; padding: 2px 0; }
.gauge-svg { width: 100%; max-width: 160px; height: auto; }
.gauge-numero { font-family: var(--fonte-display); font-size: 26px; margin-top: -4px; }
.gauge-rotulo { font-size: 13px; font-weight: 700; letter-spacing: 0.02em; margin-top: 3px; }
.gauge-zona-selo { display: inline-block; margin-top: 6px; font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.bloco-gauges-pesquisa { grid-column: span 2; }
.bloco-gauges-par { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 640px) { .bloco-gauges-par { grid-template-columns: 1fr; } }

.bloco-evolucao-pesquisa { grid-column: span 2; }
.faixa-evolucao-linha { display: flex; align-items: center; gap: 10px; margin: 10px 0; }
.faixa-evolucao-rotulo { width: 48px; flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.02em; }
.faixa-evolucao-celulas { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
.faixa-evolucao-celula { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 44px; padding: 6px 4px; border-radius: 8px; color: #fff; }
.faixa-evolucao-mes { font-size: 9px; text-transform: uppercase; opacity: 0.9; }
.faixa-evolucao-valor { font-family: var(--fonte-display); font-size: 15px; line-height: 1.2; }
.zona-nps-legenda { font-size: 14px; color: var(--texto-suave); margin: 10px 0 0; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
.zona-nps-legenda-item { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; }
.zona-nps-legenda-ponto { width: 13px; height: 13px; border-radius: 50%; display: inline-block; }
.zona-nps-legenda-fonte { width: 100%; font-size: 12px; font-style: italic; opacity: 0.85; font-weight: 400; margin-top: 2px; }

/* ---------------------------------------------------------------------- */
/* Painel de Pesquisas, comparativo entre 20d/45d/90d/Desligamento.       */
/* ---------------------------------------------------------------------- */

.painel-tabela-wrap { overflow-x: auto; }
.painel-tabela { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.painel-tabela th { text-align: left; padding: 8px 10px; color: var(--texto-suave); font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--borda-forte); }
.painel-tabela td { padding: 9px 10px; border-bottom: 1px solid var(--bg); vertical-align: top; }
.painel-tema-nome { font-weight: 700; color: var(--texto); white-space: nowrap; }
.painel-celula-vazia { color: var(--texto-fraco); }
.painel-valor { font-family: var(--fonte-display); font-size: 15px; }
.painel-seta { font-size: 11px; font-weight: 700; }
.painel-seta.sobe { color: var(--cb-verde-escuro); }
.painel-seta.desce { color: #C0472A; }
.painel-seta.estavel { color: var(--texto-fraco); }
.painel-meta-cel { font-size: 10.5px; color: var(--texto-fraco); font-weight: 400; }

.painel-unicos-grid, .painel-abertos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 10px; }
.painel-unico-card, .painel-abertos-bloco { background: var(--bg); border-radius: var(--raio); padding: 12px 14px; }
.painel-unico-titulo { font-size: 12.5px; font-weight: 700; color: var(--texto); margin: 0 0 8px; }
.painel-unico-linha { display: grid; grid-template-columns: 110px 1fr 24px; align-items: center; gap: 8px; font-size: 11.5px; margin-bottom: 5px; }
.painel-unico-trilho { height: 7px; background: var(--superficie); border-radius: 999px; overflow: hidden; }
.painel-unico-barra { height: 100%; border-radius: 999px; background: var(--cb-verde); }
.funil-segmento-rotulo { font-family: var(--fonte-corpo); font-size: 11px; fill: var(--texto); font-weight: 600; }
.funil-segmento-valor { font-family: var(--fonte-display); font-size: 15px; fill: #fff; }

/* ---------------------------------------------------------------------- */
/* Heatmap (CSS grid)                                                     */
/* ---------------------------------------------------------------------- */

.heatmap-container { overflow-x: auto; }
.heatmap-grid { display: grid; gap: 4px; font-size: 11px; min-width: 420px; }
.heatmap-celula-cabecalho {
  font-size: 10.5px; font-weight: 700; color: var(--texto-fraco); text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; padding: 4px 0;
}
.heatmap-celula-linha {
  font-size: 11.5px; font-weight: 700; color: var(--texto); display: flex; align-items: center; padding-right: 8px;
}
.heatmap-celula {
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 12px;
  min-height: 40px;
  transition: transform var(--transicao);
}
.heatmap-celula:hover { transform: scale(1.05); }

/* ---------------------------------------------------------------------- */
/* Tabelas                                                                 */
/* ---------------------------------------------------------------------- */

.tabela-scroll { overflow-x: auto; }
.tabela-indicador { width: 100%; border-collapse: collapse; font-size: 13px; }
.tabela-indicador th {
  text-align: left; padding: 9px 12px; background: var(--bg);
  color: var(--texto-suave); font-size: 10.5px; text-transform: uppercase;
  letter-spacing: 0.03em; white-space: nowrap; position: sticky; top: 0;
  border-bottom: 1px solid var(--borda);
}
.tabela-indicador td { padding: 8px 12px; border-bottom: 1px solid var(--bg); }
.tabela-indicador tbody tr:hover { background: var(--bg); }
.tabela-indicador td:first-child, .tabela-indicador th:first-child { font-weight: 600; color: var(--texto); }

/* ---------------------------------------------------------------------- */
/* Painel Modo Desenvolvedor                                              */
/* ---------------------------------------------------------------------- */

.painel-dev {
  position: fixed;
  top: 0; right: 0;
  width: min(480px, 100vw);
  height: 100vh;
  background: var(--superficie);
  border-left: 1px solid var(--borda);
  box-shadow: -12px 0 32px rgba(0,0,0,0.08);
  z-index: 40;
  display: flex;
  flex-direction: column;
}

.painel-dev-cabecalho {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px; border-bottom: 1px solid var(--borda);
}
.painel-dev-cabecalho h2 { font-family: var(--fonte-display); font-size: 18px; color: var(--texto); margin: 0; }

.painel-dev-conteudo { padding: 18px 22px; overflow-y: auto; font-size: 13px; }

.dev-secao { margin-bottom: 22px; }
.dev-secao h3 {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
  color: var(--texto-suave); border-bottom: 1px solid var(--borda);
  padding-bottom: 6px; margin-bottom: 8px;
}
.dev-linha { padding: 5px 0; border-bottom: 1px dashed var(--bg); line-height: 1.5; }
.dev-linha:last-child { border-bottom: none; }
.dev-tag { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-right: 6px; }
.dev-tag.ok { background: var(--cb-verde-suave); color: var(--cb-verde-escuro); }
.dev-tag.aviso { background: #FDF1D6; color: #8A6400; }
.dev-tag.erro { background: #FBE3DA; color: #A5401D; }
.dev-vazio { color: var(--texto-fraco); font-style: italic; }

/* ---------------------------------------------------------------------- */
/* Responsivo                                                             */
/* ---------------------------------------------------------------------- */

@media (max-width: 900px) {
  .app-shell { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; padding: 12px 16px; }
  .sidebar-brand { padding: 0; margin-right: 16px; }
  .sidebar-nav { flex-direction: row; overflow-x: auto; flex: 1; }
  .sidebar-footer { border-top: none; padding-top: 0; margin-left: 12px; }

  .painel-dev { width: 100vw; }
  .hero-periodo { padding: 26px 22px; }
  .hero-periodo-titulo { font-size: 30px; }
}

te a impacto na saúde mental. Esse tema já havia aparecido antes na pesquisa de clima (2025), o que sugere um padrão recorrente, não um caso isolado.", "_linhaPlanilha": 3}, {"mes": "Julho", "insight": "Na pesquisa de Desligamento, o NPS de Julho ficou em 0,0 (14 respondentes), um resultado bem dividido entre extremos: de um lado, relatos muito positivos sobre acolhimento, aprendizado e desenvolvimento profissional; do outro, queixas recorrentes de falta de reconhecimento e de despreparo de lideranças/coordenação.", "_linhaPlanilha": 4}, {"mes": "Julho", "insight": "Falta de reconhecimento aparece como tema repetido tanto na pesquisa de Desligamento quanto, de forma mais indireta, no Onboarding, não parece ser um caso isolado de uma pessoa ou loja específica.", "_linhaPlanilha": 5}, {"mes": "Julho", "insight": "No Onboarding (45 e 90 dias), comunicação e treinamento inicial seguem como principal ponto de melhoria: processos pouco documentados, dependência de uma única pessoa pra tirar dúvidas, e materiais de apoio desatualizados aparecem em mais de um relato.", "_linhaPlanilha": 6}, {"mes": "Julho", "insight": "Do lado positivo, o tema mais citado nas três pesquisas, sem exceção, é o acolhimento da equipe no dia a dia. Isso é consistente mês a mês e vale ser reconhecido como um ponto forte real da operação.", "_linhaPlanilha": 7}, {"mes": "Agosto", "insight": "Na Pesquisa de Desligamento, o NPS de Agosto caiu para -33,3 (12 respondentes), revertendo a estabilidade de Julho (0,0). Relação com a liderança volta a ser o motivo mais citado para a saída, à frente de salário e falta de reconhecimento, mesmo padrão dos meses anteriores, mas agora com mais peso.", "_linhaPlanilha": 8}, {"mes": "Agosto", "insight": "Atenção: um dos relatos de Desligamento de Agosto descreve especificamente assédio moral e comentários de cunho sexual por parte de uma liderança, além de coação para pedido de demissão. Esse caso é pontual e merece checagem direta com a área responsável, fora do agregado do dashboard.", "_linhaPlanilha": 9}, {"mes": "Agosto", "insight": "Nos três estágios de Onboarding (20, 45 e 90 dias), o acolhimento da equipe segue como o ponto positivo mais citado, replicando o padrão dos meses anteriores, inclusive quando o restante da nota é baixo, os respondentes separam claramente \"equipe\" de \"liderança/processo\".", "_linhaPlanilha": 10}, {"mes": "Agosto", "insight": "Despreparo de líderes diretos e coordenadores para gestão de pessoas aparece em Onboarding 45 dias (\"líderes sem treinamento de como gerir pessoas\") e ecoa o tema central de Desligamento no mesmo mês, sugere que é a mesma lacuna de formação de liderança aparecendo em dois pontos diferentes da jornada.", "_linhaPlanilha": 11}, {"mes": "Agosto", "insight": "Em Onboarding 20 dias, além do NPS mais alto entre os quatro tipos de pesquisa (75,0), aparecem dois pontos operacionais concretos e recorrentes: falta de clareza sobre valores/datas de depósito e ocasiões sem marmita disponível na loja, obrigando o colaborador a comprar a própria refeição.", "_linhaPlanilha": 12}], "insightsComunicacao": [{"mes": "Julho", "insight": "Pesquisa de satisfação Conecta + Festa Julina (aplicada de 07 a 10/07): 53 respostas de 89 convidados (59,6% de adesão), participação baixa, então os resultados abaixo refletem uma amostra qualitativa, não o grupo todo.", "_linhaPlanilha": 3}, {"mes": "Julho", "insight": "Festa Julina foi muito bem avaliada por quem respondeu: comida e bebidas com 100% de aprovação (Boa/Excelente), avaliação geral também 100% positiva (Gostei bastante ou Adorei). O único ponto de melhoria citado com frequência foi música/ambiente (22% pediu para melhorar).", "_linhaPlanilha": 4}, {"mes": "Julho", "insight": "Nos comentários espontâneos da festa, os destaques foram a energia dos Cabaneiros, a organização do evento, a integração entre times (especialmente com as embaixadinhas) e o churrasco, citado várias vezes como ponto alto.", "_linhaPlanilha": 5}, {"mes": "Julho", "insight": "O Conecta (reunião) teve nota máxima de recomendação (10) em todas as respostas, com boa avaliação de clareza e relevância dos temas. Oportunidades levantadas: melhorar som/estrutura do ambiente, considerar voto único no reconhecimento Gente Boa, e trazer mais novidades de Operações, Financeiro e Tecnologia nos próximos encontros.", "_linhaPlanilha": 6}], "colaboradoresAtivos": [{"mes": "Julho", "total": 435, "_linhaPlanilha": 3}, {"mes": "Agosto", "total": 421, "_linhaPlanilha": 4}], "admissoesLoja": [{"mes": "Julho", "total": 28, "_linhaPlanilha": 3}, {"mes": "Agosto", "total": 73, "_linhaPlanilha": 4}], "_colunasFaltantes": {"vagas": [], "comunicacao.calendario": [], "comunicacao.performance": [], "comunicacao.baseCanais": [], "treinamentos": [], "recrutamento": [], "eventos": [], "analiseEstrategica": [], "pesquisas": [], "npsDesligamento": [], "npsOnboarding90": [], "npsOnboarding45": [], "entregasEstrategicas": [], "insightsPesquisas": [], "insightsComunicacao": []}, "_meta": {"geradoEm": "2026-09-15T20:40:36.144991Z", "mesReferencia": null, "mesReferenciaOrigem": null, "avisos": ["Nenhuma célula \"Mês de referência\" foi encontrada nas abas do Dashboard Consolidado — o painel abre em modo \"Acumulado\" por padrão.", "As abas do Dashboard Consolidado (exceto CONTROLE DE VAGAS) não possuem coluna de Ano explícita — o agrupamento por período usa apenas o nome do mês.", "Admissões são contabilizadas exclusivamente pela coluna ADMISSAO REAL de CONTROLE DE VAGAS. A coluna Admissoes de Recrutamento & Selecao é ignorada para esse fim, por decisão validada em 24/07/2026."]}, "npsOnboarding20": [{"mes": "Agosto", "respondentes": 12, "nps": 75.0, "lnps": 58.3, "_linhaPlanilha": 3}], "vagasOperacionais": [], "metasSlaOperacional": [{"cargo": "Jovem Aprendiz", "metaEntregaDu": 10, "metaGestorDias": 3, "metaAdmissaoDias": 7, "metaFechamentoDias": 20, "_linhaPlanilha": 4}, {"cargo": "Auxiliar de Limpeza", "metaEntregaDu": 10, "metaGestorDias": 3, "metaAdmissa   <script>
/**
 * utils.js
 * INDICADORES DHO, Cabana Burger
 *
 * Funções utilitárias puras e reutilizáveis usadas por loader.js e metrics.js.
 * Nada neste arquivo lê planilhas ou calcula indicadores, só dá suporte a
 * quem calcula, para evitar duplicação de código (Etapa 3, requisito 8).
 */

// ---------------------------------------------------------------------------
// Normalização de texto (comparação tolerante a acento, caixa e espaço)
// ---------------------------------------------------------------------------

/**
 * Gera uma chave de comparação normalizada: minúsculas, sem acento, sem
 * quebras de linha, sem espaços duplicados/nas pontas.
 * Usada tanto para casar nomes de coluna/aba quanto para agrupar valores
 * que só diferem por acentuação (ex.: "Marco" vs "Março" -> mesma chave).
 * @param {string} valor
 * @returns {string}
 */
function normalizarChave(valor) {
  if (valor === null || valor === undefined) return '';
  return String(valor)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '') // remove acentos/cedilha
    .replace(/[\r\n]+/g, ' ')        // cabeçalhos com quebra de linha (ex.: "PRAZO SLA\nENTREGA")
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}

/**
 * Aparência final de um texto normalizado por espaços/quebras (sem mexer em
 * acento ou caixa), usado para exibir valores "limpos" ao usuário.
 * @param {string} valor
 * @returns {string}
 */
function limparEspacos(valor) {
  if (valor === null || valor === undefined) return '';
  return String(valor).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim();
}

/**
 * Dicionários de sinônimos conhecidos (Etapa 2, Seção 1), aprovados pela
 * Silvana. A chave de cada entrada já é normalizada com normalizarChave().
 * Novas variações de escrita podem ser adicionadas aqui sem alterar nenhuma
 * outra parte do sistema.
 */
const MAPA_SINONIMOS = {
  status_vaga: {
    fechado: 'Fechada',
  },
  origem_candidato: {
    'transfencia interna': 'Transferência Interna',
  },
  nivel_cargo: {
    '09 - especialista': '09- Especialista',
  },
  bu_treinamento: {
    operacoes: 'Operações (Lojas Próprias)',
  },
  canal_comunicacao: {
    'instagram - diario': 'Diário do Cabaneiro - Insta',
    'instagram interno': 'Diário do Cabaneiro - Insta',
  },
};

/** Nomes de mês canônicos, na ordem do ano, e suas chaves normalizadas. */
const MESES_ORDEM = [
  'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
  'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro',
];

const MESES_POR_CHAVE = MESES_ORDEM.reduce((acc, mes) => {
  acc[normalizarChave(mes)] = mes;
  return acc;
}, {});

/**
 * Normaliza um valor de texto usando um mapa de sinônimos + o mapa canônico
 * de meses. Registra a normalização no logger, se houver alteração.
 * @param {string} valorBruto
 * @param {Object|null} mapaSinonimos - um dos objetos de MAPA_SINONIMOS, ou null
 * @param {import('./utils.js').DevLogger} [logger]
 * @param {string} [contexto] - "Aba > Coluna", usado só na mensagem de log
 * @returns {string}
 */
function normalizarValorTexto(valorBruto, mapaSinonimos, logger, contexto) {
  const limpo = limparEspacos(valorBruto);
  if (!limpo) return limpo;

  const chave = normalizarChave(limpo);

  // 1) mês (aplica-se a qualquer coluna que contenha nome de mês)
  if (MESES_POR_CHAVE[chave]) {
    const canonico = MESES_POR_CHAVE[chave];
    if (canonico !== limpo && logger) {
      logger.logNormalizacao(contexto, limpo, canonico);
    }
    return canonico;
  }

  // 2) sinônimo específico do campo
  if (mapaSinonimos && mapaSinonimos[chave]) {
    const canonico = mapaSinonimos[chave];
    if (canonico !== limpo && logger) {
      logger.logNormalizacao(contexto, limpo, canonico);
    }
    return canonico;
  }

  return limpo;
}

// ---------------------------------------------------------------------------
// Matching tolerante de abas e colunas (Etapa 2, Seção 2)
// ---------------------------------------------------------------------------

/**
 * Encontra, numa lista de nomes de abas de um workbook, a que melhor
 * corresponde a um conjunto de aliases aceitos.
 * @param {string[]} nomesAbasDisponiveis
 * @param {string[]} aliasesAceitos
 * @returns {string|null} nome real da aba encontrada, ou null
 */
function encontrarNomeAba(nomesAbasDisponiveis, aliasesAceitos) {
  const aliasesNormalizados = aliasesAceitos.map(normalizarChave);
  for (const nome of nomesAbasDisponiveis) {
    if (aliasesNormalizados.includes(normalizarChave(nome))) {
      return nome;
    }
  }
  // fallback: contém (útil se a aba ganhar um sufixo, ex. "CI_Performance (2026)")
  for (const nome of nomesAbasDisponiveis) {
    const nomeNorm = normalizarChave(nome);
    if (aliasesNormalizados.some((a) => nomeNorm.includes(a))) {
      return nome;
    }
  }
  return null;
}

/**
 * Dada a linha de cabeçalho de uma aba (array de células) e a definição de
 * colunas esperadas (ver loader.js), devolve o índice de cada campo
 * reconhecido (com todos os candidatos, caso haja mais de uma coluna com
 * cabeçalho compatível) e a lista de campos obrigatórios não encontrados.
 * @param {Array<string|null>} linhaCabecalho
 * @param {Object<string, {aliases: string[], obrigatoria: boolean}>} definicoesColunas
 * @returns {{indices: Object<string, number>, candidatos: Object<string, number[]>, faltantes: string[]}}
 */
/**
 * Dada a linha de cabeçalho de uma aba (array de células) e a definição de
 * colunas esperadas (ver loader.js), devolve o índice de cada campo
 * reconhecido e a lista de campos obrigatórios não encontrados.
 *
 * Ordem de prioridade da correspondência (nunca por "contém"/substring):
 *   1) nome do cabeçalho igual a um alias, literalmente;
 *   2) nome do cabeçalho igual a um alias após normalização (acento, caixa,
 *      espaço, quebras de linha), já embutido em normalizarChave();
 *   3) qualquer alias cadastrado na lista da coluna.
 * Se nada disso bater com confiança, a coluna é reportada como não
 * encontrada, nunca "adivinhada" por semelhança parcial de texto.
 * @param {Array<string|null>} linhaCabecalho
 * @param {Object<string, {aliases: string[], obrigatoria: boolean}>} definicoesColunas
 * @returns {{indices: Object<string, number>, candidatos: Object<string, number[]>, faltantes: string[]}}
 */
function mapearIndicesColunas(linhaCabecalho, definicoesColunas) {
  const cabecalhoNormalizado = linhaCabecalho.map((c) => normalizarChave(c));
  const indices = {};
  const candidatos = {};
  const faltantes = [];

  for (const [campo, def] of Object.entries(definicoesColunas)) {
    const aliasesNorm = def.aliases.map(normalizarChave);
    const idxEncontrados = cabecalhoNormalizado
      .map((c, i) => (aliasesNorm.includes(c) ? i : -1))
      .filter((i) => i !== -1);

    if (idxEncontrados.length === 0) {
      if (def.obrigatoria) faltantes.push(campo);
    } else {
      indices[campo] = idxEncontrados[0];
      candidatos[campo] = idxEncontrados;
    }
  }
  return { indices, candidatos, faltantes };
}

// ---------------------------------------------------------------------------
// Datas
// ---------------------------------------------------------------------------

/**
 * Converte o valor lido da planilha (Date do SheetJS, string ou vazio) em
 * um objeto Date válido, ou null se não houver data.
 * @param {*} valor
 * @returns {Date|null}
 */
function paraData(valor) {
  if (!valor) return null;
  if (valor instanceof Date && !isNaN(valor.getTime())) return valor;
  const tentativa = new Date(valor);
  return isNaN(tentativa.getTime()) ? null : tentativa;
}

// ---------------------------------------------------------------------------
// Estatística / agregação (usadas por metrics.js)
// ---------------------------------------------------------------------------

/** Soma valores numéricos de uma lista, ignorando null/undefined/NaN. */
function somar(valores) {
  return valores.reduce((acc, v) => (typeof v === 'number' && !isNaN(v) ? acc + v : acc), 0);
}

/** Média de valores numéricos válidos; retorna null se não houver nenhum. */
function media(valores) {
  const validos = valores.filter((v) => typeof v === 'number' && !isNaN(v));
  if (validos.length === 0) return null;
  return somar(validos) / validos.length;
}

/** Conta quantos itens de um array satisfazem um predicado. */
function contar(itens, predicado = () => true) {
  return itens.filter(predicado).length;
}

/**
 * Agrupa uma lista de registros por uma função de chave, devolvendo
 * { chave: [registros...] }.
 * @param {Array<Object>} itens
 * @param {function(Object): string} funcaoChave
 * @returns {Object<string, Array<Object>>}
 */
function agruparPor(itens, funcaoChave) {
  const grupos = {};
  for (const item of itens) {
    const chave = funcaoChave(item) ?? 'Não informado';
    if (!grupos[chave]) grupos[chave] = [];
    grupos[chave].push(item);
  }
  return grupos;
}

/** Percentual (0 a 100) com 1 casa decimal; retorna null se denominador for 0. */
function percentual(numerador, denominador) {
  if (!denominador) return null;
  return arredondar((numerador / denominador) * 100, 1);
}

/**
 * Variação entre o valor atual e o anterior, em percentual e absoluto.
 * @returns {{absoluta: number, percentual: number|null}}
 */
function variacao(valorAtual, valorAnterior) {
  const absoluta = arredondar(valorAtual - valorAnterior, 2);
  const perc = valorAnterior ? arredondar((absoluta / valorAnterior) * 100, 1) : null;
  return { absoluta, percentual: perc };
}

/** Arredonda para N casas decimais (padrão 2), preservando null. */
function arredondar(numero, casas = 2) {
  if (numero === null || numero === undefined || isNaN(numero)) return null;
  const fator = 10 ** casas;
  return Math.round(numero * fator) / fator;
}

// ---------------------------------------------------------------------------
// DevLogger, alimenta o Modo Desenvolvedor (Etapa 2, Seção 6)
// ---------------------------------------------------------------------------

/**
 * Registra tudo que acontece durante a importação e o cálculo, para exibição
 * no Modo Desenvolvedor. Nunca lança exceção, é só um coletor de eventos.
 */
class DevLogger {
  constructor() {
    /** @type {{arquivo:string,aba:string}[]} */
    this.abasUtilizadas = [];
    /** @type {{arquivo:string,aba:string,motivo:string}[]} */
    this.abasIgnoradas = [];
    /** @type {{aba:string,campo:string,coluna:string}[]} */
    this.colunasReconhecidas = [];
    /** @type {{aba:string,campo:string}[]} */
    this.colunasNaoReconhecidas = [];
    /** @type {{aba:string,campo:string,colunasCandidatas:string[],colunaEscolhida:string,motivo:string}[]} */
    this.conflitosColuna = [];
    /** @type {{contexto:string,de:string,para:string,ocorrencias:number}[]} */
    this.normalizacoes = [];
    /** @type {{aba:string,linhasNaPlanilha:number,registrosReais:number}[]} */
    this.contagemLinhas = [];
    /** @type {{origem:string,mensagem:string}[]} */
    this.erros = [];
    this.inicioProcessamento = null;
    this.fimProcessamento = null;
  }

  logAbaUtilizada(arquivo, aba) {
    this.abasUtilizadas.push({ arquivo, aba });
  }

  logAbaIgnorada(arquivo, aba, motivo) {
    this.abasIgnoradas.push({ arquivo, aba, motivo });
  }

  logColunaReconhecida(aba, campo, coluna) {
    this.colunasReconhecidas.push({ aba, campo, coluna });
  }

  logColunaNaoReconhecida(aba, campo) {
    this.colunasNaoReconhecidas.push({ aba, campo });
  }

  /**
   * Registra um conflito resolvido automaticamente: mais de uma coluna do
   * cabeçalho correspondia ao mesmo campo (ex.: cabeçalho com coluna
   * duplicada/legada). Não é um erro, é uma decisão automática que precisa
   * ficar visível no Modo Desenvolvedor.
   * @param {string} aba
   * @param {string} campo
   * @param {string[]} colunasCandidatas - nomes das colunas candidatas
   * @param {string} colunaEscolhida - nome da coluna escolhida
   * @param {string} motivo
   */
  logConflitoColuna(aba, campo, colunasCandidatas, colunaEscolhida, motivo) {
    this.conflitosColuna.push({ aba, campo, colunasCandidatas, colunaEscolhida, motivo });
  }

  logNormalizacao(contexto, de, para) {
    const existente = this.normalizacoes.find(
      (n) => n.contexto === contexto && n.de === de && n.para === para
    );
    if (existente) {
      existente.ocorrencias += 1;
    } else {
      this.normalizacoes.push({ contexto, de, para, ocorrencias: 1 });
    }
  }

  logContagemLinhas(aba, linhasNaPlanilha, registrosReais) {
    this.contagemLinhas.push({ aba, linhasNaPlanilha, registrosReais });
  }

  /**
   * Registra um erro sem interromper o processamento (requisito 4 da Etapa 3).
   * @param {string} origem - ex.: "Aba CI_Performance, linha 12"
   * @param {string} mensagem
   */
  logErro(origem, mensagem) {
    this.erros.push({ origem, mensagem });
  }

  iniciarCronometro() {
    this.inicioProcessamento = performance.now();
  }

  pararCronometro() {
    this.fimProcessamento = performance.now();
  }

  get tempoProcessamentoMs() {
    if (this.inicioProcessamento === null || this.fimProcessamento === null) return null;
    return arredondar(this.fimProcessamento - this.inicioProcessamento, 1);
  }

  /** Gera um relatório plano, pronto para o Modo Desenvolvedor exibir. */
  gerarRelatorio() {
    return {
      abasUtilizadas: this.abasUtilizadas,
      abasIgnoradas: this.abasIgnoradas,
      colunasReconhecidas: this.colunasReconhecidas,
      colunasNaoReconhecidas: this.colunasNaoReconhecidas,
      conflitosColuna: this.conflitosColuna,
      normalizacoes: this.normalizacoes,
      contagemLinhas: this.contagemLinhas,
      erros: this.erros,
      tempoProcessamentoMs: this.tempoProcessamentoMs,
    };
  }
}

/**
 * performance.now() não existe em todo ambiente (ex.: alguns runtimes Node
