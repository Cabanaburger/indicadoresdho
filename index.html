/**
 * Lê um arquivo .xlsx selecionado pelo usuário e devolve o workbook do
 * SheetJS. Só funciona em ambiente de navegador (usa FileReader).
 * @param {File} arquivo
 * @returns {Promise<import('xlsx').WorkBook>}
 */
function lerArquivoExcel(arquivo) {
  return new Promise((resolve, reject) => {
    const leitor = new FileReader();
    leitor.onload = (evento) => {
      try {
        const dadosBrutos = new Uint8Array(evento.target.result);
        const workbook = XLSX.read(dadosBrutos, { type: 'array', cellDates: true });
        resolve(workbook);
      } catch (erro) {
        reject(erro);
      }
    };
    leitor.onerror = () => reject(leitor.error);
    leitor.readAsArrayBuffer(arquivo);
  });
}

// ---------------------------------------------------------------------------
// Leitura genérica de uma aba (independente de browser ou Node, recebe o
// workbook já carregado). Cada aba só é lida (sheet_to_json) uma única vez.
// ---------------------------------------------------------------------------

/**
 * @param {import('xlsx').WorkBook} workbook
 * @param {string} nomeArquivo - só para log ("Controle de Vagas" / "Dashboard Consolidado")
 * @param {string[]} aliasesAba
 * @param {number} linhaCabecalho - índice 0-based da linha de cabeçalho
 * @param {Object} definicoesColunas
 * @param {DevLogger} logger
 * @param {{campoObrigatorioPresenca?: string}} [opcoes] - campo que precisa
 *   estar preenchido para a linha contar como registro real (filtra blocos
 *   de linhas em branco pré-formatadas, ex.: DHO Treinamentos)
 * @returns {Array<Object>} registros normalizados
 */
function lerAbaGenerica(workbook, nomeArquivo, aliasesAba, linhaCabecalho, definicoesColunas, logger, opcoes = {}) {
  const nomeAbaReal = encontrarNomeAba(workbook.SheetNames, aliasesAba);
  if (!nomeAbaReal) {
    logger.logErro(nomeArquivo, `Nenhuma aba encontrada para os aliases: ${aliasesAba.join(', ')}`);
    // Mesmo formato de retorno de sempre, só que com tudo vazio/faltante.
    // Sem isso, quem chama esta função (ex.: carregarDashboardConsolidado)
    // quebraria tentando desestruturar um array como se fosse objeto.
    const camposObrigatorios = Object.entries(definicoesColunas).filter(([, def]) => def.obrigatoria).map(([campo]) => campo);
    return { registrosBrutos: [], indices: {}, nomeAbaReal: null, faltantes: camposObrigatorios };
  }

  const planilha = workbook.Sheets[nomeAbaReal];
  // Uma única leitura da aba inteira, como matriz de valores.
  const linhas = XLSX.utils.sheet_to_json(planilha, { header: 1, raw: true, defval: null });

  // Detecção dinâmica do cabeçalho: a posição esperada (linhaCabecalho) é só
  // um palpite inicial. Se alguém inserir/remover linhas acima (ex.: uma
  // legenda), a linha real do cabeçalho se desloca, então procuramos nas
  // primeiras 20 linhas qual delas bate com mais campos esperados, e só
  // usamos essa se ela for claramente melhor que o palpite original.
  let melhorLinha = linhaCabecalho;
  let melhorPontuacao = Object.keys(mapearIndicesColunas(linhas[linhaCabecalho] || [], definicoesColunas).indices).length;
  for (let i = 0; i < Math.min(20, linhas.length); i++) {
    if (i === linhaCabecalho) continue;
    const pontuacao = Object.keys(mapearIndicesColunas(linhas[i] || [], definicoesColunas).indices).length;
    if (pontuacao > melhorPontuacao) {
      melhorPontuacao = pontuacao;
      melhorLinha = i;
    }
  }
  if (melhorLinha !== linhaCabecalho) {
    logger.logErro(nomeArquivo, `Aba "${nomeAbaReal}": cabeçalho esperado na linha ${linhaCabecalho + 1} não bateu bem; usando a linha ${melhorLinha + 1} em vez disso (${melhorPontuacao} colunas reconhecidas lá).`);
  }
  linhaCabecalho = melhorLinha;

  const cabecalho = linhas[linhaCabecalho] || [];
  const { indices, candidatos, faltantes } = mapearIndicesColunas(cabecalho, definicoesColunas);
  const corpoDados = linhas.slice(linhaCabecalho + 1);

  // Desempate: se mais de uma coluna do cabeçalho bate com o mesmo campo
  // (cabeçalho duplicado/legado, ex.: "Local" e "Nome do evento" em
  // Eventos), usa a que tiver mais valores preenchidos. Isso é registrado
  // como um conflito resolvido, não como um erro.
  for (const [campo, listaIdx] of Object.entries(candidatos)) {
    if (listaIdx.length <= 1) continue;
    let melhorIdx = listaIdx[0];
    let melhorPreenchimento = -1;
    for (const idx of listaIdx) {
      const preenchidos = corpoDados.filter((l) => l && l[idx] !== null && l[idx] !== undefined && l[idx] !== '').length;
      if (preenchidos > melhorPreenchimento) {
        melhorPreenchimento = preenchidos;
        melhorIdx = idx;
      }
    }
    logger.logConflitoColuna(
      nomeAbaReal,
      campo,
      listaIdx.map((i) => cabecalho[i]),
      cabecalho[melhorIdx],
      `Escolhida por ter mais dados preenchidos (${melhorPreenchimento} registros) que as demais colunas candidatas.`
    );
    indices[campo] = melhorIdx;
  }

  for (const campo of Object.keys(indices)) {
    logger.logColunaReconhecida(nomeAbaReal, campo, cabecalho[indices[campo]]);
  }
  for (const campo of faltantes) {
    logger.logColunaNaoReconhecida(nomeAbaReal, campo);
    logger.logErro(nomeAbaReal, `Coluna obrigatória "${campo}" não encontrada (aliases esperados: ${definicoesColunas[campo].aliases.join(', ')})`);
  }

  const registros = [];
  const linhasDeDados = corpoDados;

  for (let i = 0; i < linhasDeDados.length; i += 1) {
    const linha = linhasDeDados[i];
    if (!linha || linha.every((v) => v === null || v === undefined || v === '')) continue;

    if (opcoes.campoObrigatorioPresenca) {
      const idxObrig = indices[opcoes.campoObrigatorioPresenca];
      if (idxObrig === undefined || linha[idxObrig] === null || linha[idxObrig] === undefined || linha[idxObrig] === '') {
        continue; // linha-template em branco, não é registro real
      }
    }

    registros.push({ linha, numeroLinhaPlanilha: linhaCabecalho + 2 + i });
  }

  logger.logAbaUtilizada(nomeArquivo, nomeAbaReal);
  logger.logContagemLinhas(nomeAbaReal, linhasDeDados.length, registros.length);

  return { registrosBrutos: registros, indices, nomeAbaReal, faltantes };
}

/**
 * Converte um registro bruto (linha + índices) num objeto de campos
 * nomeados, aplicando parsing de data/número e normalização de texto onde
 * necessário. Erros pontuais (célula com tipo inesperado) são registrados
 * e não interrompem a leitura das demais linhas/campos.
 */
function montarObjeto(registroBruto, indices, definicoesColunas, nomeAba, logger, opcoes = {}) {
  const { linha, numeroLinhaPlanilha } = registroBruto;
  const objeto = {};

  for (const campo of Object.keys(definicoesColunas)) {
    const idx = indices[campo];
    let valor = idx === undefined ? null : linha[idx];

    try {
      if (opcoes.camposData && opcoes.camposData.includes(campo)) {
        valor = paraData(valor);
      } else if (opcoes.camposNumericos && opcoes.camposNumericos.includes(campo)) {
        valor = typeof valor === 'number' ? valor : (valor === null || valor === '' ? null : Number(valor));
        if (valor !== null && isNaN(valor)) {
          logger.logErro(`${nomeAba}, linha ${numeroLinhaPlanilha}`, `Valor não numérico no campo "${campo}": "${linha[idx]}"`);
          valor = null;
        }
      } else if (typeof valor === 'string') {
        const mapaSinonimos = (opcoes.sinonimosPorCampo && opcoes.sinonimosPorCampo[campo]) || null;
        valor = normalizarValorTexto(valor, mapaSinonimos, logger, `${nomeAba} > ${campo}`);
      } else if (valor !== null) {
        valor = limparEspacos(String(valor));
      }
    } catch (erro) {
      logger.logErro(`${nomeAba}, linha ${numeroLinhaPlanilha}`, `Falha ao processar campo "${campo}": ${erro.message}`);
      valor = null;
    }

    objeto[campo] = valor;
  }

  objeto._linhaPlanilha = numeroLinhaPlanilha;
  return objeto;
}

/**
 * Traduz a lista de campos faltantes (nomes internos) de uma leitura de aba
 * para um formato pronto para consulta pelas guardas de indicador em
 * metrics.js: nome do campo + nome de coluna esperado (para a mensagem).
 * @param {string[]} faltantes
 * @param {Object} definicoesColunas
 * @returns {{campo:string, nomeEsperado:string}[]}
 */
function formatarFaltantes(faltantes, definicoesColunas) {
  return faltantes.map((campo) => ({ campo, nomeEsperado: definicoesColunas[campo].aliases[0] }));
}

/**
 * Procura, nas primeiras linhas de cada aba do workbook, uma célula rotulada
 * "Mes de referencia" (o dropdown que a própria Silvana/Nayuri já usa nos
 * painéis internos do Excel) e devolve o valor escolhido na célula ao lado.
 * Isso evita perguntar ou tentar adivinhar o mês do envio, o valor já está
 * na planilha, só precisa ser lido.
 * @param {import('xlsx').WorkBook} workbook
 * @returns {{valor: string, aba: string, celula: string}|null}
 */
function encontrarMesReferencia(workbook) {
  for (const nomeAba of workbook.SheetNames) {
    const planilha = workbook.Sheets[nomeAba];
    const linhas = XLSX.utils.sheet_to_json(planilha, { header: 1, raw: true, defval: null });
    const limite = Math.min(linhas.length, 10);
    for (let r = 0; r < limite; r += 1) {
      const linha = linhas[r] || [];
      for (let c = 0; c < linha.length; c += 1) {
        if (linha[c] && normalizarChave(linha[c]) === 'mes de referencia' && linha[c + 1]) {
          return { valor: limparEspacos(String(linha[c + 1])), aba: nomeAba, celula: XLSX.utils.encode_cell({ r, c: c + 1 }) };
        }
      }
    }
  }
  return null;
}

function carregarVagas(workbook, logger) {
  const nomeArquivo = 'Controle de Vagas';

  // abas explicitamente ignoradas, registradas mesmo sem tentar ler
  for (const aba of workbook.SheetNames) {
    if (ABAS_IGNORADAS_CONTROLE_VAGAS.includes(aba)) {
      logger.logAbaIgnorada(nomeArquivo, aba, MOTIVO_IGNORADA[aba] || 'aba de apoio');

  const { registrosBrutos, indices, nomeAbaReal, faltantes } = lerAbaGenerica(
    workbook, nomeArquivo, ['CONTROLE DE VAGAS'], LINHA_CABECALHO.CONTROLE_DE_VAGAS, COLUNAS_VAGAS, logger
  );

  const registros = registrosBrutos.map((r) => montarObjeto(r, indices, COLUNAS_VAGAS, nomeAbaReal || 'CONTROLE DE VAGAS', logger, {
    camposData: CAMPOS_DATA_VAGAS,

/**

 * SheetJS. Cada aba é lida uma única vez (requisito 5 da Etapa 3).
 * @param {import('xlsx').WorkBook} workbookControleVagas
 * @param {import('xlsx').WorkBook} workbookDashboardConsolidado
 * @returns {{dados: Object, log: Object}}
 */
function construirDadosCentrais(workbookControleVagas, workbookDashboardConsolidado) {
  const logger = new DevLogger();
  logger.iniciarCronometro();

  const { registros: vagas, faltantes: faltantesVagas } = carregarVagas(workbookControleVagas, logger);
  const { comunicacao, treinamentos, recrutamento, eventos, analiseEstrategica, pesquisas, npsDesligamento, npsOnboarding90, npsOnboarding45, entregasEstrategicas, insightsPesquisas, insightsComunicacao, colaboradoresAtivos, admissoesLoja, faltantes: faltantesConsolidado } =
    carregarDashboardConsolidado(workbookDashboardConsolidado, logger);

  // "Dashboard Executivo" é uma aba oculta que a Silvana pediu pra ignorar
  // (25/07), por isso não buscamos mais "Mês de referência" em lugar
  // nenhum. O painel abre sempre em "Acumulado" por padrão agora.
  const mesReferenciaEncontrado = null;

  logger.pararCronometro();

  const dados = {
    vagas,
    recrutamento,
    treinamentos,
    comunicacao,
    eventos,
    analiseEstrategica,
    pesquisas,
    npsDesligamento,
    npsOnboarding90,
    npsOnboarding45,
    entregasEstrategicas,
    insightsPesquisas,
    insightsComunicacao,
    colaboradoresAtivos,
    admissoesLoja,
    _colunasFaltantes: {
      vagas: faltantesVagas,
      ...faltantesConsolidado,
    },
    _meta: {
      geradoEm: new Date().toISOString(),
      mesReferencia: mesReferenciaEncontrado ? mesReferenciaEncontrado.valor : null,
      mesReferenciaOrigem: mesReferenciaEncontrado ? `${mesReferenciaEncontrado.aba} (célula ${mesReferenciaEncontrado.celula})` : null,
      avisos: [
        mesReferenciaEncontrado
          ? `Mês de referência lido automaticamente de "${mesReferenciaEncontrado.aba}" (célula ${mesReferenciaEncontrado.celula}): "${mesReferenciaEncontrado.valor}".`
          : 'Nenhuma célula "Mês de referência" foi encontrada nas abas do Dashboard Consolidado, o painel abre em modo "Acumulado" por padrão.',
        'As abas do Dashboard Consolidado (exceto CONTROLE DE VAGAS) não possuem coluna de Ano explícita, o agrupamento por período usa apenas o nome do mês.',
        'Admissões são contabilizadas exclusivamente pela coluna ADMISSAO REAL de CONTROLE DE VAGAS. A coluna Admissoes de Recrutamento & Selecao é ignorada para esse fim, por decisão validada em 24/07/2026.',
      ],
    },
  };

  return { dados, log: logger.gerarRelatorio() };
}

/**
 * Ponto de entrada usado pelo navegador: recebe os dois arquivos escolhidos
 * pelo usuário no botão "Atualizar Dados" e devolve o objeto central pronto.
 * @param {File} arquivoControleVagas
 * @param {File} arquivoDashboardConsolidado
 * @returns {Promise<{dados: Object, log: Object}>}
 */
async function carregarPlanilhas(arquivoControleVagas, arquivoDashboardConsolidado) {
  const [workbookControleVagas, workbookDashboardConsolidado] = await Promise.all([
    lerArquivoExcel(arquivoControleVagas),
    lerArquivoExcel(arquivoDashboardConsolidado),
  ]);
  return construirDadosCentrais(workbookControleVagas, workbookDashboardConsolidado);
}

/**
 * Monta o objeto de resultado padrão de qualquer indicador, garante que
 * todo indicador do sistema seja auditável da mesma forma.

function criarResultado(p) {
  return {
    id: p.id,
    nome: p.nome,
    categoria: p.categoria,
    valor: p.valor,
    status: p.status,
    registrosUtilizados: p.registrosUtilizados ?? 0,

    formula: p.formula,

    id: meta.id,
    nome: meta.nome,
    categoria: meta.categoria,
    valor: null,

  });
}

/**
 * Confere, para uma lista de dependências ({colecao, campos}), quais campos
 * estão na lista de colunas faltantes montada por loader.js.
 * @param {Object} dados
 * @param {{colecao:string, campos:string[]}[]} dependencias
 * @returns {{colecao:string, campo:string, nomeEsperado:string}[]}
 */
function verificarDependencias(dados, dependencias) {
  const faltando = [];
  const colunasFaltantes = dados._colunasFaltantes || {};
  for (const dep of dependencias) {
    const listaFaltantesDaColecao = colunasFaltantes[dep.colecao] || [];
    for (const item of listaFaltantesDaColecao) {
      if (dep.campos.includes(item.campo)) {
        faltando.push({ colecao: dep.colecao, ...item });
      }
    }
  }
  return faltando;
}

/**
 * Fábrica de indicador: aplica a guarda de dependências antes de calcular.
 * `calcular(dados, filtros)` deve devolver { valor, registrosUtilizados,
 * detalhe?, observacoes?, status? }, o wrapper cuida do resto.
 * @param {Object} meta
 * @param {string} meta.id
 * @param {string} meta.nome
 * @param {string} meta.categoria
 * @param {string} meta.abaOrigem
 * @param {string[]} meta.colunasUtilizadas
 * @param {string} meta.formula
 * @param {string} meta.periodicidade
 * @param {string[]} [meta.filtrosDisponiveis]
 * @param {{colecao:string, campos:string[]}[]} [meta.dependencias] - use isto
 *   quando o indicador cruzar mais de uma coleção (ex.: alcance_sobre_base)
 * @param {string} [meta.colecao] - atalho quando há só 1 coleção
 * @param {string[]} [meta.camposObrigatorios] - usado junto com meta.colecao
 * @param {function(Object, Object): Object} calcular
 */
function criarIndicadorSeguro(meta, calcular) {
  const dependencias = meta.dependencias || [{ colecao: meta.colecao, campos: meta.camposObrigatorios || [] }];

  const indicador = function (dados, filtros = {}) {
    const faltando = verificarDependencias(dados, dependencias);
    if (faltando.length > 0) {
      return criarResultadoIndisponivel(meta, faltando, filtros);
    }

    const parcial = calcular(dados, filtros) || {};
    return criarResultado({
      id: meta.id,
      nome: meta.nome,
      categoria: meta.categoria,
      valor: parcial.valor,
      status: parcial.status || STATUS_INDICADOR.ATIVO,
      registrosUtilizados: parcial.registrosUtilizados ?? 0,
      abaOrigem: meta.abaOrigem,
      colunasUtilizadas: meta.colunasUtilizadas,
      formula: meta.formula,
      periodicidade: meta.periodicidade,
      filtrosDisponiveis: meta.filtrosDisponiveis,
      filtrosAplicados: filtros,
      observacoes: parcial.observacoes || '',
      detalhe: parcial.detalhe,
    });
  };

  indicador.meta = meta;
  indicador.dependencias = dependencias;
  return indicador;
}

// ---------------------------------------------------------------------------
// Helpers de filtro (compartilhados por todos os indicadores)
// ---------------------------------------------------------------------------

function aplicarFiltrosCategoricos(registros, filtros) {
  const chaves = Object.keys(filtros).filter(
    (k) => !['mes', 'ano'].includes(k) && filtros[k] !== undefined && filtros[k] !== null && filtros[k] !== ''
  );
  if (chaves.length === 0) return registros;
  return registros.filter((r) =>
    chaves.every((k) => !(k in r) || normalizarChave(r[k]) === normalizarChave(filtros[k]))
  );
}

function aplicarFiltroPeriodoPorCampoMes(registros, filtros) {
  if (!filtros.mes) return registros;
  return registros.filter((r) => r.mes && normalizarChave(r.mes) === normalizarChave(filtros.mes));
}

function dataNoPeriodo(data, filtros) {
  if (!data) return false;
  if (filtros.ano && data.getUTCFullYear() !== Number(filtros.ano)) return false;
  if (filtros.mes) {
    const mesRegistro = MESES_ORDEM[data.getUTCMonth()];
    if (normalizarChave(mesRegistro) !== normalizarChave(filtros.mes)) return false;
  }
  return true;
}

/**
 * Ordem real das etapas do processo seletivo, usada pra ordenar os dois
 * "funis" (agora em barra, não mais em forma de funil de verdade: ordenar
 * por quantidade fazia o desenho "afinar e alargar" no meio, porque a
 * quantidade de vagas em cada etapa não é decrescente na prática).
 */
const ETAPA_ORDEM = [
  'Alinhamento/Divulgação', 'Triagem de CVs', 'Entrevista c/ Atração', 'Entrevistas RH',
  'Entrevista c/ Gestor', 'Em proposta', 'Aprovado', 'Pré Admissão', 'Encerrado', 'Cancelado', 'Congelado',
];

function ordenarPorEtapaDoProcesso(distribuicao) {
  return [...distribuicao].sort((a, b) => {
    const ia = ETAPA_ORDEM.indexOf(a.etapa);
    const ib = ETAPA_ORDEM.indexOf(b.etapa);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
  });
}

});

});

/**
 * Evolução mês a mês (por mês/ano real, nunca só pelo nome do mês, pra não
 * misturar Dezembro/2025 com um Dezembro futuro): abertas, fechadas, SLA
 * médio de entrega/fechamento, tempo admissional médio e % no prazo.
 */
const calcularEvolucaoMensalRecrutamento = criarIndicadorSeguro({
  id: 'evolucao_mensal_recrutamento', nome: 'Evolução Mensal de Recrutamento', categoria: 'Recrutamento & Seleção',
  colecao: 'vagas',
  camposObrigatorios: ['dataAbertura', 'dtFechamento', 'status', 'slaFechamentoDias', 'tempoAdmissional', 'statusSlaFechamento'],
  abaOrigem: 'CONTROLE DE VAGAS',
  colunasUtilizadas: ['DATA ABERTURA', 'DT FECHAMENTO', 'STATUS', 'SLA FECHAMENTO (40 DIAS)', 'TEMPO ADMISSIONAL', 'STATUS SLA FECHAMENTO'],
  formula: 'Agrupado por mês/ano real de abertura (para "abertas") e de fechamento (para "fechadas" e médias de SLA)',
  periodicidade: 'série contínua', filtrosDisponiveis: ['bu', 'area', 'gestor'],
}, (dados, filtros) => {
  const base = aplicarFiltrosCategoricos(dados.vagas, filtros);
  const chaveMes = (data) => `${MESES_ORDEM[data.getUTCMonth()]}/${data.getUTCFullYear()}`;
  const ordemChave = (c) => { const [mes, ano] = c.split('/'); return Number(ano) * 12 + MESES_ORDEM.indexOf(mes); };

  const chaves = new Set();
  base.forEach((v) => {
    if (v.dataAbertura) chaves.add(chaveMes(v.dataAbertura));
    if (v.dtFechamento) chaves.add(chaveMes(v.dtFechamento));
  });

  const tabela = [...chaves].sort((a, b) => ordemChave(a) - ordemChave(b)).map((mesAno) => {
    const abertasNoMes = base.filter((v) => v.dataAbertura && chaveMes(v.dataAbertura) === mesAno);
    const fechadasNoMes = base.filter((v) => v.status === 'Fechada' && v.dtFechamento && chaveMes(v.dtFechamento) === mesAno);
    const fechamentoAplicaveis = fechadasNoMes.filter((v) => v.statusSlaFechamento && v.statusSlaFechamento !== '-');

    return {
      mes: mesAno,
      abertas: abertasNoMes.length,
      fechadas: fechadasNoMes.length,
      slaFechamentoMedio: media(fechadasNoMes.filter((v) => typeof v.slaFechamentoDias === 'number').map((v) => v.slaFechamentoDias)),
      tempoAdmMedio: media(fechadasNoMes.filter((v) => typeof v.tempoAdmissional === 'number').map((v) => v.tempoAdmissional)),
      percFechamentoPrazo: percentual(contar(fechamentoAplicaveis, (v) => v.statusSlaFechamento === 'no prazo'), fechamentoAplicaveis.length),
    };
  });

  return { valor: tabela, registrosUtilizados: base.length, detalhe: tabela };
});

/**
 * Funil só das vagas que estão Abertas agora, diferente do funil geral
 * (que mistura encerradas/canceladas), este mostra só o pipeline vivo,
 * exatamente como o "FUNIL DO PROCESSO (vagas Abertas)" da planilha.
 */
const calcularFunilVagasAbertas = criarIndicadorSeguro({
  id: 'funil_vagas_abertas', nome: 'Funil de Vagas Abertas', categoria: 'Recrutamento & Seleção',
  colecao: 'vagas', camposObrigatorios: ['status', 'etapa'],
  abaOrigem: 'CONTROLE DE VAGAS', colunasUtilizadas: ['STATUS', 'ETAPA'],
  formula: 'COUNT() agrupado por ETAPA, somente onde STATUS = "Aberta"',
  periodicidade: 'snapshot', filtrosDisponiveis: ['bu', 'area', 'gestor'],
}, (dados, filtros) => {
  const base = aplicarFiltrosCategoricos(dados.vagas, filtros).filter((v) => v.status === 'Aberta');
  const grupos = agruparPor(base, (v) => v.etapa);
  const distribuicao = ordenarPorEtapaDoProcesso(Object.entries(grupos).map(([etapa, itens]) => ({ etapa, quantidade: itens.length })));
  const contraditorias = contar(base, (v) => v.etapa === 'Encerrado' || v.etapa === 'Cancelado');

  return {
    valor: distribuicao,
    registrosUtilizados: base.length,
    detalhe: distribuicao,
    observacoes: contraditorias > 0
      ? `Só considera vagas com STATUS = "Aberta", diferente do "Funil do Processo Seletivo" geral. Atenção: ${contraditorias} vaga(s) está(ão) com STATUS = "Aberta" mas ETAPA = "Encerrado"/"Cancelado" (dado contraditório na planilha); aparecem aqui normalmente, sem serem escondidas.`
      : 'Só considera vagas com STATUS = "Aberta", diferente do "Funil do Processo Seletivo" geral, que inclui todas as vagas (inclusive já encerradas/canceladas).',
  };
});

/** Vagas abertas hoje, agrupadas por faixa de tempo em aberto (aging), igual ao "PAINEL DE AGING" da planilha. */
const calcularAgingFaixasRisco = criarIndicadorSeguro({
  id: 'aging_faixas_risco', nome: 'Aging de Vagas Abertas, Faixas de Risco', categoria: 'Recrutamento & Seleção',
  colecao: 'vagas', camposObrigatorios: ['status', 'agingDias'],
  abaOrigem: 'CONTROLE DE VAGAS', colunasUtilizadas: ['STATUS', 'AGING (DIAS)'],
  formula: 'COUNT() de vagas com STATUS = "Aberta", agrupadas em faixas de AGING (DIAS): até 30 / 31-60 / 61-90 / acima de 90',
  periodicidade: 'snapshot', filtrosDisponiveis: ['bu', 'area', 'gestor'],
}, (dados, filtros) => {
  const abertas = aplicarFiltrosCategoricos(dados.vagas, filtros).filter((v) => v.status === 'Aberta' && typeof v.agingDias === 'number');
  const faixas = [

  const distribuicao = faixas.map((f) => ({ faixa: f.faixa, quantidade: contar(abertas, (v) => v.agingDias >= f.min && v.agingDias <= f.max) }));
  return { valor: distribuicao, registrosUtilizados: abertas.length, detalhe: distribuicao };

  const grupos = agruparPor(fechadas, (v) => v.area);
  const tabela = Object.entries(grupos).map(([area, itens]) => {

    return {

  return { valor: tabela, registrosUtilizados: fechadas.length, detalhe: tabela };

/**
 * Horas por Colaborador, Horas Ministradas ÷ Participantes Treinados: a
 * intensidade média de treinamento recebida por pessoa no período (não é
 * "horas ÷ ativos da empresa", que exigiria uma fonte de headcount que não
 * temos hoje). Fórmula confirmada batendo com o exemplo da própria Silvana:
 * 18h ÷ 48 participantes = 0,37h/pessoa.
 */
const calcularHorasPorColaborador = criarIndicadorSeguro({
  id: 'horas_por_colaborador', nome: 'Horas por Colaborador (Participantes Treinados)', categoria: 'Treinamentos',
  colecao: 'treinamentos', camposObrigatorios: ['horasTotais', 'participantes', 'acompanhamentoLoja'],
  abaOrigem: 'DHO Treinamentos', colunasUtilizadas: ['Horas totais', 'Participantes', 'Acompanhamento loja'],
  formula: 'Σ(Participantes×Horas totais por linha) / SOMA(Participantes), excluindo visita técnica. Não é SOMA(Horas totais)/SOMA(Participantes), isso não pondera pela turma que cada pessoa de fato frequentou.',
  periodicidade: 'mensal', filtrosDisponiveis: ['bu', 'tipo', 'mes'],
}, (dados, filtros) => {
  const base = aplicarFiltroPeriodoPorCampoMes(aplicarFiltrosCategoricos(dados.treinamentos, filtros), filtros)
    .filter((t) => t.acompanhamentoLoja !== 'Sim');
  const horasParticipante = somar(base.map((t) => (t.participantes || 0) * (t.horasTotais || 0)));
  const participantes = somar(base.map((t) => t.participantes));
  if (!participantes) {
    return { valor: null, registrosUtilizados: base.length, status: STATUS_INDICADOR.AGUARDANDO_DADOS, observacoes: 'Sem participantes no período, não dá pra calcular horas por colaborador.' };
  }
  return { valor: arredondar(horasParticipante / participantes, 2), registrosUtilizados: base.length };
});

/**
 * Horas por Colaborador (Total Cabana), Horas Ministradas ÷ TOTAL de
 * colaboradores ativos da empresa (não só quem foi treinado). É a métrica
 * que a chefe da Silvana usa no Book de Metas 2026, pedido explícito pra
 * levar pro dashboard (28/07). Precisa da aba "Colaboradores Ativos", que
 * a Silvana informa mês a mês, enquanto não tiver o número do mês
 * filtrado, o indicador fica "Aguardando dados" (nunca inventa).
 */
/**
 * Horas por Colaborador (Total Cabana), metodologia "horas-participante",
 * validada com a Silvana em 12/08: para CADA registro de treinamento
 * (exceto visitas de acompanhamento/"visita técnica"), multiplica
 * Participantes × Horas totais daquela linha, soma tudo, e só então divide
 * pelo total de colaboradores ativos da empresa. Não é a mesma coisa que
 * "Horas Ministradas ÷ Colaboradores", uma turma com mais gente pesa mais
 * nessa conta, o que é a intenção (mede alcance real, não só duração).
 */
/**
 * Admissões de Loja, processo descentralizado de contratação nas lojas,
 * que não passa pelo Controle de Vagas formal (esse cobre só o processo de
 * R&S). A Silvana informa esse número diretamente, mês a mês, igual faz
 * com o headcount total.
 */
const calcularAdmissoesLoja = criarIndicadorSeguro({
  id: 'admissoes_loja', nome: 'Admissões de Loja', categoria: 'Recrutamento & Seleção',

  periodicidade: 'mensal', filtrosDisponiveis: ['mes'],
}, (dados, filtros) => {
  if (!filtros.mes) {
    return { valor: null, registrosUtilizados: 0, status: STATUS_INDICADOR.AGUARDANDO_DADOS, observacoes: 'Selecione um mês, esse número é informado mês a mês.' };
  }
  const registro = dados.admissoesLoja.find((r) => r.mes === filtros.mes);
  if (!registro) {
    return { valor: null, registrosUtilizados: 0, status: STATUS_INDICADOR.AGUARDANDO_DADOS, observacoes: `Admissões de loja de ${filtros.mes} ainda não informadas.` };
  }
  return { valor: registro.total, registrosUtilizados: 1, observacoes: 'Processo descentralizado, não passa pelo Controle de Vagas formal de R&S.' };
});

const calcularHorasPorColaboradorTotal = criarIndicadorSeguro({

  colecao: 'treinamentos', camposObrigatorios: ['horasTotais', 'participantes', 'acompanhamentoLoja'],
  dependencias: [{ colecao: 'colaboradoresAtivos', campos: ['mes', 'total'] }],
  abaOrigem: 'DHO Treinamentos + Colaboradores Ativos', colunasUtilizadas: ['Participantes', 'Horas totais', 'Acompanhamento loja', 'Total'],
  formula: 'SOMA(Participantes x Horas totais, por linha, excluindo Acompanhamento loja = "Sim") / Total de colaboradores ativos no mês',
  periodicidade: 'mensal', filtrosDisponiveis: ['mes'],
}, (dados, filtros) => {
  if (!filtros.mes) {
    return { valor: null, registrosUtilizados: 0, status: STATUS_INDICADOR.AGUARDANDO_DADOS, observacoes: 'Selecione um mês, o total de colaboradores ativos é informado mês a mês, não faz sentido em "Acumulado".' };
  }
  const base = aplicarFiltroPeriodoPorCampoMes(dados.treinamentos, filtros).filter((t) => t.acompanhamentoLoja !== 'Sim');
  const horasParticipante = somar(base.map((t) => (t.participantes || 0) * (t.horasTotais || 0)));

  }
  return {
    valor: arredondar(horasParticipante / registroHeadcount.total, 2),
    registrosUtilizados: base.length,
    detalhe: { horasParticipante, colaboradoresAtivos: registroHeadcount.total },

});

/** SUBSTITUÍDO por calcularVisitasAcompanhamentoPorTema, aquele mostra tema,

const calcularHistoricoMensalTreinamentos = criarIndicadorSeguro({
  id: 'historico_mensal_treinamentos', nome: 'Histórico Mensal de Treinamentos', categoria: 'Treinamentos',
  colecao: 'treinamentos', camposObrigatorios: ['mes'],
  abaOrigem: 'DHO Treinamentos', colunasUtilizadas: ['Mes', 'Participantes', 'Horas totais'],
  formula: 'Série temporal por Mes, mesmo agrupamento de quantidade/participantes/horas',
  periodicidade: 'série contínua', filtrosDisponiveis: ['bu', 'tipo'],
}, (dados, filtros) => {
  const base = aplicarFiltrosCategoricos(dados.treinamentos, filtros);
  const grupos = agruparPor(base, (t) => t.mes);
  const serie = MESES_ORDEM
    .filter((mes) => grupos[mes])
    .map((mes) => ({

  formula: 'SOMA(Participantes) agrupado por Tipo x Mes',
  periodicidade: 'série contínua', filtrosDisponiveis: ['bu'],
}, (dados, filtros) => {
  const base = aplicarFiltrosCategoricos(dados.treinamentos, filtros);
  const mesesPresentes = MESES_ORDEM.filter((mes) => base.some((t) => t.mes === mes));

  const matriz = tipos.map((tipo) => ({

    })),
  }));
  return { valor: { meses: mesesPresentes, linhas: matriz }, registrosUtilizados: base.length, detalhe: matriz };
});

/**
 * Tabela: um treinamento por linha, chamado pelo próprio nome (Tema), sem
 * precisar cadastrar cada Tema no código, qualquer treinamento novo que
 * aparecer na planilha entra aqui automaticamente. Exclui as linhas de
 * visita de acompanhamento pós-treinamento (essas têm indicador próprio,
 * porque Participantes=0 nelas distorceria a média de participantes).
 */
const calcularTreinamentosPorTema = criarIndicadorSeguro({
  id: 'treinamentos_por_tema', nome: 'Treinamentos', categoria: 'Treinamentos',
  colecao: 'treinamentos', camposObrigatorios: ['tema', 'tipo', 'turmas', 'participantes', 'horasTotais', 'acompanhamentoLoja'],
  abaOrigem: 'DHO Treinamentos', colunasUtilizadas: ['Tema', 'Tipo', 'Turmas', 'Participantes', 'Horas totais'],
  formula: 'SOMA(Turmas), SOMA(Participantes), SOMA(Horas totais) agrupados por Tema, excluindo linhas com Acompanhamento loja = "Sim". Horas/Participante = Σ(Participantes×Horas totais por linha) ÷ Σ(Participantes), não é Horas totais ÷ Participantes (isso subestima, porque não pondera pela turma que cada pessoa de fato frequentou).',
  periodicidade: 'mensal', filtrosDisponiveis: ['bu', 'tipo', 'mes'],
}, (dados, filtros) => {
  const base = aplicarFiltroPeriodoPorCampoMes(aplicarFiltrosCategoricos(dados.treinamentos, filtros), filtros)
    .filter((t) => t.acompanhamentoLoja !== 'Sim');
  const grupos = agruparPor(base, (t) => t.tema);
  const tabela = Object.entries(grupos).map(([tema, itens]) => {
    const turmas = somar(itens.map((t) => t.turmas));
    const participantes = somar(itens.map((t) => t.participantes));
    const horasTotais = somar(itens.map((t) => t.horasTotais));
    const horasParticipante = somar(itens.map((t) => (t.participantes || 0) * (t.horasTotais || 0)));
    const locais = [...new Set(itens.map((t) => t.lojaOuTime).filter(Boolean))];
    const observacoes = [...new Set(itens.map((t) => t.observacao).filter(Boolean))];
    return {
      tema,
      tipo: itens[0].tipo,
      turmas,
      participantes,
      horasTotais,
      horasPorColaborador: participantes > 0 ? arredondar(horasParticipante / participantes, 2) : null,
      locais,
      observacoes,
    };
  }).sort((a, b) => b.participantes - a.participantes);
  return { valor: tabela, registrosUtilizados: base.length, detalhe: tabela };
});

/**
 * Envolve qualquer indicador numérico para compará-lo com o mesmo indicador
 * no mês anterior. Não recalcula nada por conta própria, só chama a função
 * do indicador duas vezes com períodos diferentes.
 */
function compararComMesAnterior(funcaoIndicador, dados, mesAtual, anoAtual, filtrosExtras = {}) {
  const idxAtual = MESES_ORDEM.findIndex((m) => normalizarChave(m) === normalizarChave(mesAtual));
  if (idxAtual === -1) {
    throw new Error(`Mês inválido: ${mesAtual}`);
  }
  const idxAnterior = (idxAtual - 1 + 12) % 12;
  const mesAnterior = MESES_ORDEM[idxAnterior];
  const anoAnterior = anoAtual !== null && idxAtual === 0 ? anoAtual - 1 : anoAtual;

  const resultadoAtual = funcaoIndicador(dados, { ...filtrosExtras, mes: mesAtual, ...(anoAtual !== null ? { ano: anoAtual } : {}) });
  const resultadoAnterior = funcaoIndicador(dados, { ...filtrosExtras, mes: mesAnterior, ...(anoAnterior !== null ? { ano: anoAnterior } : {}) });

  const valorAtual = typeof resultadoAtual.valor === 'number' ? resultadoAtual.valor : null;
  const valorAnterior = typeof resultadoAnterior.valor === 'number' ? resultadoAnterior.valor : null;

  return {
    atual: resultadoAtual,
    anterior: resultadoAnterior,
    variacao: valorAtual !== null && valorAnterior !== null ? variacao(valorAtual, valorAnterior) : null,
  };
}

/** NPS do mês filtrado, número único, pra entrar na Visão Geral com comparação ao mês anterior. */

/**
 * NPS/L-NPS não é uma soma entre meses, mas a Nayuri (01/09) pediu pra
 * "Acumulado" não ficar vazio, mesmo assim, ela quer ver um número com
 * base em todas as respostas até hoje. Aqui a resposta é uma média
 * ponderada por respondentes entre os meses com dado (estimativa, não é
 * o NPS recalculado a partir das notas originais de cada resposta).
 */
function mediaPonderadaAcumulada(registros, campo) {
  const validos = registros.filter((r) => typeof r[campo] === 'number' && typeof r.respondentes === 'number');
  if (validos.length === 0) return null;
  const pesoTotal = validos.reduce((s, r) => s + r.respondentes, 0);
  if (pesoTotal === 0) return null;
  return Math.round((validos.reduce((s, r) => s + r[campo] * r.respondentes, 0) / pesoTotal) * 10) / 10;
}

/**
 * Entregas Estratégicas do DHO, roadmap de projetos/iniciativas (Chefe do
 * Padrão, Cabana School, etc.), mantido pela Silvana mês a mês. Nenhuma
 * conta aqui, é texto direto da planilha, só organizado pra exibição.
 */
const calcularEntregasEstrategicas = criarIndicadorSeguro({
  id: 'entregas_estrategicas', nome: 'Entregas Estratégicas', categoria: 'Projetos',
  colecao: 'entregasEstrategicas', camposObrigatorios: ['mes', 'titulo', 'descricao'],
  abaOrigem: 'Entregas Estrategicas', colunasUtilizadas: ['Mes', 'Titulo', 'Descricao', 'Status'],
  formula: 'Registros de Entregas Estrategicas agrupados por Titulo (projeto); dentro de cada projeto, ordenados por Mes',
  periodicidade: 'roadmap', filtrosDisponiveis: [],
}, (dados) => {
  const base = dados.entregasEstrategicas;
  const porProjeto = {};
  for (const e of base) {
    const chave = e.titulo;
    if (!porProjeto[chave]) porProjeto[chave] = [];
    porProjeto[chave].push({
      mes: e.mes,
      descricao: e.descricao,
      status: e.status || 'Em andamento',
      responsavel: e.responsavel || null,
      // Campos ainda sem coluna correspondente na planilha (ver nota em
      // renderizarEntregasEstrategicas), ficam null até existirem.
      tema: e.tema || null,
      resultadoEsperado: e.resultadoEsperado || null,
      tipo: e.dataConcluida && e.dataConcluida <= new Date() ? 'realizado' : (e.dataPrevista || e.dataConcluida) ? 'planejado' : (e.tipo || 'realizado'),
      dataPrevista: e.dataPrevista || null,
      dataConcluida: e.dataConcluida || null,
    });
  }
  const projetos = Object.entries(porProjeto).map(([projeto, itens]) => {
    const ordenados = [...itens].sort((a, b) => MESES_ORDEM.indexOf(a.mes) - MESES_ORDEM.indexOf(b.mes));
    return { projeto, itens: ordenados, ultimoMesIndex: MESES_ORDEM.indexOf(ordenados[ordenados.length - 1].mes) };
  }).sort((a, b) => b.ultimoMesIndex - a.ultimoMesIndex);

  return { valor: projetos, registrosUtilizados: base.length, detalhe: projetos };
});

  { id: 'entregas_estrategicas', fn: calcularEntregasEstrategicas },
].map((entrada) => ({ ...entrada, categoria: entrada.fn.meta.categoria }));

/**
 * Executa todos os indicadores do catálogo contra o objeto central de
 * dados. Um erro num indicador nunca impede o cálculo dos demais.
 * @returns {{resultados: Object<string, Object>, erros: {id:string,mensagem:string}[]}}
 */
function calcularTodosIndicadores(dados, filtros = {}) {
  const resultados = {};
  const erros = [];

  for (const entrada of CATALOGO_INDICADORES) {
    try {
      resultados[entrada.id] = entrada.fn(dados, filtros);
    } catch (erro) {
      erros.push({ id: entrada.id, mensagem: erro.message });
      resultados[entrada.id] = criarResultado({
        id: entrada.id,
        nome: entrada.id,
        categoria: entrada.categoria,
        valor: null,
        status: STATUS_INDICADOR.INDISPONIVEL,
        abaOrigem: ',',
        formula: ',',
        periodicidade: ',',
        observacoes: `Erro ao calcular: ${erro.message}`,
      });
    }
  }

  return { resultados, erros };
}

/**
 * Para cada coluna obrigatória faltante detectada na importação, lista
 * exatamente quais indicadores do catálogo dependem dela. Usado pelo Modo
 * Desenvolvedor para responder "o que foi impactado por essa planilha
 * incompleta", sem precisar rodar todos os indicadores primeiro.
 * @param {Object} dados
 * @returns {{colecao:string, campo:string, nomeEsperado:string, indicadoresImpactados:string[]}[]}
 */
function listarImpactoColunasFaltantes(dados) {
  const impacto = [];
  for (const [colecao, faltantes] of Object.entries(dados._colunasFaltantes || {})) {
    for (const { campo, nomeEsperado } of faltantes) {
      const indicadoresImpactados = CATALOGO_INDICADORES
        .filter((entrada) => entrada.fn.dependencias.some((dep) => dep.colecao === colecao && dep.campos.includes(campo)))
        .map((entrada) => entrada.id);
      impacto.push({ colecao, campo, nomeEsperado, indicadoresImpactados });
    }
  }
  return impacto;
}

// ---------------------------------------------------------------------------
// Rotina de validação interna
// ---------------------------------------------------------------------------

/**
 * Executa todos os indicadores e produz um relatório de saúde do cálculo:
 * o que funcionou, o que está indisponível/aguardando dados (com o motivo
 * e os indicadores impactados), inconsistências detectadas automaticamente
 * e o tempo total gasto. Deve ser chamada uma vez logo após
 * `construirDadosCentrais()` (loader.js).
 * @param {Object} dados
 * @returns {Object} relatório de validação
 */
function executarValidacaoCompleta(dados) {
  const inicio = performance.now();
  const { resultados, erros } = calcularTodosIndicadores(dados);
  const fim = performance.now();

  const calculadosComSucesso = [];
  const aguardandoDados = [];
  const indisponiveis = [];
  const inconsistencias = [];

  for (const [id, resultado] of Object.entries(resultados)) {
    if (resultado.status === STATUS_INDICADOR.ATIVO) {
      calculadosComSucesso.push(id);
      const valorVazio = resultado.valor === null || (Array.isArray(resultado.valor) && resultado.valor.length === 0);
      if (resultado.registrosUtilizados === 0 && valorVazio) {
        inconsistencias.push(`Indicador "${id}" está marcado como ativo mas não usou nenhum registro, confira os filtros aplicados ou a origem dos dados.`);
      }
    } else if (resultado.status === STATUS_INDICADOR.AGUARDANDO_DADOS) {
      aguardandoDados.push({ id, motivo: resultado.observacoes || 'coluna presente, mas ainda sem dado preenchido' });
    } else {
      indisponiveis.push({ id, motivo: resultado.observacoes || 'motivo não especificado' });
    }
  }

  for (const erro of erros) {
    inconsistencias.push(`Indicador "${erro.id}" lançou erro durante o cálculo: ${erro.mensagem}`);
  }

  return {
    totalIndicadoresNoCatalogo: CATALOGO_INDICADORES.length,
    calculadosComSucesso,
    aguardandoDados,
    indisponiveis,
    impactoColunasFaltantes: listarImpactoColunasFaltantes(dados),
    inconsistencias,
    tempoTotalMs: arredondar(fim - inicio, 1),
  };
}

    const dadosOnb45 = { disponivel: onb45.status === STATUS_INDICADOR.ATIVO && typeof onb45.valor === 'number', valor: onb45.valor, n: 12 };
    const dadosOnb90 = { disponivel: onb90.status === STATUS_INDICADOR.ATIVO && typeof onb90.valor === 'number', valor: onb90.valor, n: 8 };
    const dadosOnb20L = { disponivel: onb20Lnps.status === STATUS_INDICADOR.ATIVO && typeof onb20Lnps.valor === 'number', valor: onb20Lnps.valor, n: 12 };
    const dadosOnb45L = { disponivel: onb45Lnps.status === STATUS_INDICADOR.ATIVO && typeof onb45Lnps.valor === 'number', valor: onb45Lnps.valor, n: 12 };
    const dadosOnb90L = { disponivel: onb90Lnps.status === STATUS_INDICADOR.ATIVO && typeof onb90Lnps.valor === 'number', valor: onb90Lnps.valor, n: 8 };

    return {
      nps: mediaPonderada([dadosOnb20, dadosOnb45, dadosOnb90]),
      lnps: mediaPonderada([dadosOnb20L, dadosOnb45L, dadosOnb90L]),
    };
  };

  const arredondarUm = (n) => Math.round(n * 10) / 10;
  const mediaPonderada = (itens) => {
    const disponiveis = itens.filter((i) => i.disponivel);
    if (disponiveis.length === 0) return null;
    const pesoTotal = disponiveis.reduce((s, i) => s + i.n, 0);
    return pesoTotal > 0 ? arredondarUm(disponiveis.reduce((s, i) => s + i.valor * i.n, 0) / pesoTotal) : null;
  };

  const mesAtual = filtrosAtuais.mes;
  const idxAnterior = (MESES_ORDEM.findIndex((m) => normalizarChave(m) === normalizarChave(mesAtual)) - 1 + 12) % 12;
  const mesAnterior = MESES_ORDEM[idxAnterior];

  const jornadaAtual = calcularOnboardingPonderado(mesAtual);
  const jornadaAnterior = calcularOnboardingPonderado(mesAnterior);
  const npsOnboarding = jornadaAtual.nps;
  const lnpsOnboarding = jornadaAtual.lnps;

  const desligNps = calcularNpsMensal(dadosAtuais, filtrosAtuais);
  const desligLnps = calcularLnpsMensal(dadosAtuais, filtrosAtuais);
  const desligNpsAnt = calcularNpsMensal(dadosAtuais, { ...filtrosAtuais, mes: mesAnterior });
  const desligLnpsAnt = calcularLnpsMensal(dadosAtuais, { ...filtrosAtuais, mes: mesAnterior });
  const npsOffboarding = desligNps.status === STATUS_INDICADOR.ATIVO && typeof desligNps.valor === 'number' ? desligNps.valor : null;
  const lnpsOffboarding = desligLnps.status === STATUS_INDICADOR.ATIVO && typeof desligLnps.valor === 'number' ? desligLnps.valor : null;
  const npsOffboardingAnt = desligNpsAnt.status === STATUS_INDICADOR.ATIVO && typeof desligNpsAnt.valor === 'number' ? desligNpsAnt.valor : null;
  const lnpsOffboardingAnt = desligLnpsAnt.status === STATUS_INDICADOR.ATIVO && typeof desligLnpsAnt.valor === 'number' ? desligLnpsAnt.valor : null;

  const deltaHtml = (atual, anterior) => {
    if (atual === null || anterior === null) return '';
    const diff = arredondarUm(atual - anterior);
    const estavel = Math.abs(diff) < 0.05;
    const seta = estavel ? '＝' : diff > 0 ? '▲' : '▼';
    const cor = estavel ? 'var(--texto-fraco)' : diff > 0 ? 'var(--cb-verde-escuro)' : '#C0472A';
    return `<span class="jornada-delta" style="color:${cor}">${seta} ${Math.abs(diff).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} vs. ${mesAnterior}</span>`;
  };

  const caixa = (titulo, valor, valorAnterior, sub, placeholder) => {
    const zona = valor !== null && !placeholder ? obterZonaNps(valor) : null;
    const estilo = zona ? `background:${zona.corClara};border-left:4px solid ${zona.cor}` : '';
    return `
    <div class="jornada-caixa ${placeholder ? 'placeholder' : ''}" style="${estilo}">
      <span class="jornada-titulo">${titulo}</span>
      <span class="jornada-numero">${valor === null ? ',' : formatarNumero(null, valor)}</span>
      ${zona ? `<span class="gauge-zona-selo" style="background:${zona.cor}20;color:${corLegivelParaTexto(zona.cor)}">Zona ${zona.nome}</span>` : ''}
      ${!placeholder ? deltaHtml(valor, valorAnterior) : ''}
      <span class="jornada-sub">${sub}</span>
    </div>
  `;
  };

  return `
    <h3 class="visao-geral-subtitulo">Pesquisa de Jornada</h3>
    <p class="entregas-legenda">eNPS/L-NPS de Onboarding é a média ponderada por respondentes entre as pesquisas de 20, 45 e 90 dias.</p>
    <div class="jornada-grid">
      ${caixa('eNPS Onboarding', npsOnboarding, jornadaAnterior.nps, 'Média ponderada (20d + 45d + 90d)', false)}
      ${caixa('L-NPS Onboarding', lnpsOnboarding, jornadaAnterior.lnps, 'Média ponderada (20d + 45d + 90d)', false)}
      ${caixa('eNPS Offboarding', npsOffboarding, npsOffboardingAnt, 'Pesquisa de Desligamento', false)}
      ${caixa('L-NPS Offboarding', lnpsOffboarding, lnpsOffboardingAnt, 'Pesquisa de Desligamento', false)}
      ${caixa('eNPS Pulso', 42, null, 'Meta usada como referência, aguardando 1ª Pesquisa Pulso 2026', true)}
    </div>
    ${renderizarLegendaZonasNps()}
  `;
}

function renderizarBookMetas(temMes) {
  if (!temMes) {
    return `
      <h3 class="visao-geral-subtitulo">Book de Metas, Diretoria</h3>
      <p class="visao-geral-nota" style="margin-top:-8px;">Selecione um mês no filtro do topo pra ver o Book de Metas, essas metas são acompanhadas mês a mês, não faz sentido em Acumulado.</p>
    `;
  }

  const itens = METAS_BOOK.map((item) => {
    const resultado = item.fn(dadosAtuais, filtrosAtuais);
    const disponivel = resultado.status === STATUS_INDICADOR.ATIVO && typeof resultado.valor === 'number';
    const bateu = disponivel ? (item.direcao === 'menor' ? resultado.valor <= item.meta : resultado.valor >= item.meta) : null;

    let variacao = null;
    if (disponivel) {
      try {
        const comp = compararComMesAnterior(item.fn, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
        if (comp.variacao && typeof comp.anterior.valor === 'number') {
          const subiu = comp.variacao.absoluta >= 0;
          // "Favorável" depende da direção da meta: pra SLA de Vagas (menor
          // melhor), descer é bom; pra Horas (maior melhor), subir é bom.
          const favoravel = item.direcao === 'menor' ? !subiu : subiu;
          const deltaTexto = item.emHoraMinuto
            ? formatarHoraMinuto(Math.abs(comp.variacao.absoluta))
            : `${Math.abs(comp.variacao.absoluta).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} ${item.unidade}`;
          variacao = { subiu, favoravel, texto: deltaTexto, mesAnterior: comp.anterior.filtrosAplicados.mes };
        }
      } catch (erro) {
        console.error(`Falha ao comparar "${item.rotulo}" (Book de Metas) com o mês anterior:`, erro);
      }
    }

    return { ...item, valor: disponivel ? resultado.valor : null, disponivel, bateu, obs: resultado.observacoes, variacao };
  });

  return `
    <h3 class="visao-geral-subtitulo">Book de Metas, Diretoria</h3>
    <p class="entregas-legenda">Setas comparam com o mês anterior, verde é favorável à meta (considerando se menor ou maior é melhor pra cada indicador), laranja é desfavorável.</p>
    <div class="book-metas-grid">
      ${itens.map((it) => `
        <div class="book-meta-card ${it.disponivel ? (it.bateu ? 'batida' : 'nao-batida') : 'pendente'}">
          <div class="book-meta-cabecalho">
            <span class="book-meta-nome">${it.rotulo}</span>
            <span class="book-meta-status">${it.disponivel ? (it.bateu ? 'META BATIDA' : 'NÃO BATIDA') : 'AGUARDANDO DADO'}</span>
          </div>
          <div class="book-meta-corpo">
            <span class="book-meta-numero">${it.disponivel ? (it.emHoraMinuto ? formatarHoraMinuto(it.valor) : it.valor.toLocaleString('pt-BR', { minimumFractionDigits: it.casasDecimais || 1, maximumFractionDigits: it.casasDecimais || 1 })) : ','}</span>
            <span class="book-meta-unidade">${it.unidade}</span>
            ${it.variacao ? `<span class="book-meta-variacao ${it.variacao.favoravel ? 'favoravel' : 'desfavoravel'}">${it.variacao.subiu ? '▲' : '▼'} ${it.variacao.texto} vs. ${it.variacao.mesAnterior}</span>` : ''}
          </div>
          <p class="book-meta-detalhe">Meta: ${it.emHoraMinuto ? formatarHoraMinuto(it.meta) : it.meta} ${it.unidade} · ${it.direcao === 'menor' ? 'menor é melhor' : 'maior é melhor'} · Fonte: ${it.fonte}</p>
          ${!it.disponivel && it.obs ? `<p class="book-meta-obs">${it.obs}</p>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}

/** Card consolidado de uma área: cabeçalho colorido + "O que fizemos" + "Resultado" + botão "Ver detalhes". */
function renderizarAreaCardExecutivo(categoria, grupos, temMes) {
  const cor = CORES_AREA[categoria] || 'var(--cb-verde)';
  const corClara = CORES_AREA_CLARO[categoria] || 'var(--cb-verde-suave)';
  const secao = (rotulo, lista) => {
    if (lista.length === 0) return '';
    // Os mini-stats de NPS/L-NPS por pesquisa ("Principais Resultados")
    // saíram daqui (01/09, pedido da Nayuri): ficavam repetitivos com as
    // caixas de Pesquisa de Jornada, que já têm a seta de comparação.
    if (categoria === 'DHO' && rotulo === ROTULO_GRUPO.resultado) {
      const outros = lista.filter(({ item }) => !item.pontos);
      if (outros.length === 0) return '';
      return `
        <div class="area-card-secao">
          <h4>${rotulo}</h4>
          <ul class="area-card-lista">${outros.map(({ item, resultado }) => renderizarLinhaAreaCard(item, resultado, temMes)).join('')}</ul>
        </div>
      `;
    }
    if (categoria === 'Comunicação Interna' && rotulo === ROTULO_GRUPO.resultado) {
      const restante = lista.filter(({ item }) => item.rotulo !== 'Engajamento Médio');
      if (restante.length === 0) return '';
      return `
        <div class="area-card-secao">
          <h4>${rotulo}</h4>
          <ul class="area-card-lista">${restante.map(({ item, resultado }) => renderizarLinhaAreaCard(item, resultado, temMes)).join('')}</ul>
        </div>
      `;
    }
    return `
      <div class="area-card-secao">
        <h4>${rotulo}</h4>
        <ul class="area-card-lista">
          ${lista.map(({ item, resultado }) => renderizarLinhaAreaCard(item, resultado, temMes)).join('')}
        </ul>
      </div>
    `;
  };

  const engajamento = categoria === 'Comunicação Interna' ? renderizarEngajamentoResumo(temMes) : '';

  const destinoBotao = categoria === 'Recrutamento & Seleção' ? 'Recrutamento & Seleção, Administrativo' : categoria;
  return `
    <article class="area-card-executivo" style="--cor-area:${cor};--cor-area-clara:${corClara}">
      <div class="area-card-cabecalho">
        <span class="area-card-icone">${ICONES_AREA[categoria] || '◆'}</span>
        <h3>${NOMES_EXIBICAO_CATEGORIA[categoria] || categoria}</h3>
      </div>
      ${secao(ROTULO_GRUPO.producao, grupos.producao)}
      ${secao(ROTULO_GRUPO.resultado, grupos.resultado)}
      ${engajamento}
      <button class="area-card-cta" data-categoria="${destinoBotao}">Ver detalhes de ${NOMES_EXIBICAO_CATEGORIA[categoria] || categoria} →</button>
    </article>
  `;
}

function renderizarLinhaAreaCard(item, resultado, temMes) {
  const disponivel = resultado.status === STATUS_INDICADOR.ATIVO && typeof resultado.valor === 'number';

/** Calcula a variação vs. mês anterior, no mesmo formato pros dois lugares que mostram isso (card do topo e linha do card de área). */
function obterVariacaoTexto(item, temMes) {
  if (!temMes) return null;
  try {
    const comparacao = compararComMesAnterior(item.fn, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
    if (comparacao.variacao && item.pontos) {
      const subiu = comparacao.variacao.absoluta >= 0;
      return { subiu, seta: subiu ? '▲' : '▼', texto: `${Math.abs(comparacao.variacao.absoluta).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} pts` };
    }
    if (comparacao.variacao && comparacao.variacao.percentual !== null) {
      const subiu = comparacao.variacao.absoluta >= 0;
      return { subiu, seta: subiu ? '▲' : '▼', texto: `${Math.abs(comparacao.variacao.percentual).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%` };
    }
    if (comparacao.anterior.valor === 0 && typeof comparacao.atual.valor === 'number' && comparacao.atual.valor > 0) {
      return { subiu: true, seta: '▲', texto: 'novo' };
    }
  } catch (erro) {
    console.error(`Falha ao comparar "${item.rotulo}" com o mês anterior:`, erro);
  }
  return null;
}

  {
    fn: calcularQuantidadePublicacoes,
    titulo: (v) => (v.subiu ? 'Mais comunicados no ar' : 'Menos comunicados no ar'),
    texto: (valor, v, mesAnt) => `Publicamos ${formatarNumero(null, valor)} comunicados neste mês, ${v.subiu ? `${v.texto} a mais` : `${v.texto} a menos`} que em ${mesAnt}.`,
  },
];

function renderizarDestaquesDoMes() {
  if (!filtrosAtuais.mes) return '';

  const destaques = [];
  for (const config of CONFIG_DESTAQUES) {
    if (destaques.length >= 4) break;
    const resultado = config.fn(dadosAtuais, filtrosAtuais);
    if (resultado.status !== STATUS_INDICADOR.ATIVO || typeof resultado.valor !== 'number') continue;

    let comparacao;
    try {
      comparacao = compararComMesAnterior(config.fn, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
    } catch {
      continue;
    }
    if (!comparacao.variacao || typeof comparacao.anterior.valor !== 'number') continue;

    const v = { subiu: comparacao.variacao.absoluta >= 0, absoluta: comparacao.variacao.absoluta, texto: '' };
    const item = RESUMO_EXECUTIVO.find((i) => i.fn === config.fn);
    if (item && item.pontos) {
      v.texto = `${Math.abs(comparacao.variacao.absoluta).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} pontos`;
    } else if (comparacao.variacao.percentual !== null) {
      v.texto = `${Math.abs(comparacao.variacao.percentual).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
    } else {
      continue;
    }

    const mesAnterior = comparacao.anterior.filtrosAplicados.mes;
    destaques.push({
      titulo: config.titulo(v),
      texto: config.texto(resultado.valor, v, mesAnterior),
      subiu: v.subiu,
    });
  }

  if (destaques.length === 0) return '';

  return `
    <div class="destaques-coluna">
      <h3 class="visao-geral-subtitulo">Destaques do Mês</h3>
      <div class="destaques-painel">
        ${destaques.map((d) => `
          <div class="destaque-linha">
            <span class="destaque-icone ${d.subiu ? 'sobe' : 'desce'}">${d.subiu ? '▲' : '▼'}</span>
            <div class="destaque-corpo">
              <strong class="destaque-titulo">${d.titulo}</strong>
              <p class="destaque-texto">${d.texto}</p>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/**
 * Principais Insights do Mês, DHO. Compara as 3 pesquisas de escuta
 * (Desligamento, Onboarding 90d, Onboarding 45d) entre si e com o mês
 * anterior. Só aparece na aba DHO (pedido explícito da Silvana) e só
 * quando um mês está selecionado, comparação exige um "antes".
 */
function renderizarInsightsDHO() {
  if (!filtrosAtuais.mes) {
    return `
      <article class="cartao-indicador tem-tabela insights-card">
        <div class="cartao-cabecalho"><span class="cartao-nome">Principais Insights do Mês</span></div>
        <p class="cartao-observacao">Selecione um mês no filtro do topo, a análise compara as pesquisas entre si e com o mês anterior, então precisa de um período específico.</p>
      </article>
    `;
  }

  const pesquisas = [
    { nome: 'Desligamento', fnNps: calcularNpsMensal, fnLnps: calcularLnpsMensal },
    { nome: 'Onboarding 90 dias', fnNps: calcularNpsOnboarding90Mensal, fnLnps: calcularLnpsOnboarding90Mensal },
    { nome: 'Onboarding 45 dias', fnNps: calcularNpsOnboarding45Mensal, fnLnps: calcularLnpsOnboarding45Mensal },
  ];

  const dadosPesquisas = [];
  for (const p of pesquisas) {
    const nps = p.fnNps(dadosAtuais, filtrosAtuais);
    const lnps = p.fnLnps(dadosAtuais, filtrosAtuais);
    if (nps.status === STATUS_INDICADOR.ATIVO && typeof nps.valor === 'number') {
      dadosPesquisas.push({ nome: p.nome, nps: nps.valor, lnps: typeof lnps.valor === 'number' ? lnps.valor : null, obs: nps.observacoes, fnNps: p.fnNps });
    }
  }

  if (dadosPesquisas.length === 0) {
    return `
      <article class="cartao-indicador tem-tabela insights-card">
        <div class="cartao-cabecalho"><span class="cartao-nome">Principais Insights do Mês</span></div>
        <p class="cartao-observacao">Sem dados de nenhuma pesquisa de escuta para ${filtrosAtuais.mes}.</p>
      </article>
    `;
  }

  const linhas = [];

  if (dadosPesquisas.length > 1) {
    const ordenado = [...dadosPesquisas].sort((a, b) => b.nps - a.nps);
    const melhor = ordenado[0];
    const pior = ordenado[ordenado.length - 1];
    linhas.push(`<strong>${melhor.nome}</strong> teve o melhor NPS do mês (${formatarNumero(null, melhor.nps)}); <strong>${pior.nome}</strong> teve o pior (${formatarNumero(null, pior.nps)}).`);
  }

  for (const p of dadosPesquisas) {
    try {
      const comp = compararComMesAnterior(p.fnNps, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
      if (comp.variacao && typeof comp.atual.valor === 'number' && typeof comp.anterior.valor === 'number') {
        const subiu = comp.variacao.absoluta >= 0;
        linhas.push(`NPS de <strong>${p.nome}</strong> ${subiu ? 'melhorou' : 'piorou'} ${Math.abs(comp.variacao.absoluta).toLocaleString('pt-BR', { maximumFractionDigits: 1 })} pontos frente a ${comp.anterior.filtrosAplicados.mes} (${formatarNumero(null, comp.anterior.valor)} → ${formatarNumero(null, comp.atual.valor)}).`);
      }
    } catch (erro) {
      console.error(`Falha ao comparar NPS de "${p.nome}" com o mês anterior:`, erro);
    }
  }

  const negativos = dadosPesquisas.filter((p) => p.nps < 0);
  if (negativos.length > 0) {
    linhas.push(`${negativos.map((p) => p.nome).join(' e ')} ${negativos.length > 1 ? 'seguem' : 'segue'} com NPS negativo neste mês, vale olhar com atenção.`);
  }

  for (const p of dadosPesquisas) {
    if (p.obs && p.obs.includes('Baixa representatividade')) {
      linhas.push(`A pesquisa de <strong>${p.nome}</strong> teve baixa representatividade neste mês (${p.obs.match(/só (\d+)/)?.[1] || 'poucas'} resposta(s)), trate o resultado com cautela.`);
    }
  }

  const qualitativos = calcularInsightsPesquisas(dadosAtuais, filtrosAtuais);
  const temQualitativos = qualitativos.status === STATUS_INDICADOR.ATIVO && Array.isArray(qualitativos.valor) && qualitativos.valor.length > 0;

  return `
    <article class="cartao-indicador tem-tabela insights-card">
      <div class="cartao-cabecalho"><span class="cartao-nome">Principais Insights do Mês</span></div>
      <ul class="insights-lista">
        ${linhas.map((l) => `<li>${l}</li>`).join('')}
      </ul>
      ${temQualitativos ? `
        <h4 class="insights-subtitulo">O que as respostas abertas mostram</h4>
        <ul class="insights-lista">
          ${qualitativos.valor.map((texto) => `<li>${texto}</li>`).join('')}
        </ul>
      ` : ''}
    </article>
  `;
}

  return `

const CORES_FORMATO_DIARIO = {
  'Video (Reels)': 'var(--cb-roxo)', 'Post feed': 'var(--cb-azul)', 'Stories': 'var(--cb-dourado)',
  'Informativo': 'var(--cb-verde)', 'Outro': 'var(--texto-fraco)',
};
const PALETA_DESTAQUE_DIARIO = ['#53A246', '#E86943', '#08A3C1', '#FAB515', '#993198', '#2D5926'];

function mesMaisRecenteEntre(meses) {
  let melhorIdx = -1, melhorMes = null;
  for (const m of meses) {
    const idx = MESES_ORDEM.indexOf(m);
    if (idx > melhorIdx) { melhorIdx = idx; melhorMes = m; }
  }
  return melhorMes;
}

/** Resumo real do Diário do Cabaneiro, não é um indicador do catálogo (é lido direto pelo cartão), mas usa o mesmo pipeline de filtro/período dos outros indicadores. */
function calcularDiarioCabaneiroResumo(dados, filtros) {
  const base = aplicarFiltroPeriodoPorCampoMes(aplicarFiltrosCategoricos(dados.comunicacao.performance, filtros), filtros);
  const posts = base.filter((p) => (p.canal || '').toLowerCase().includes('cabaneiro') || (p.canal || '').toLowerCase().includes('insta'));

  const mesRecente = mesMaisRecenteEntre(posts.map((p) => p.mes).filter(Boolean));
  const postsDoMesRecente = posts.filter((p) => p.mes === mesRecente);
  const comSeguidores = [...posts].reverse().find((p) => typeof p.seguidores === 'number');
  const seguidoresAtual = (postsDoMesRecente.find((p) => typeof p.seguidores === 'number') || comSeguidores || {}).seguidores ?? null;

  const comTaxa = posts.filter((p) => typeof p.engajamentoTaxa === 'number' && p.engajamentoTaxa > 0);
  const engajamentoMedio = comTaxa.length > 0 ? media(comTaxa.map((p) => p.engajamentoTaxa)) : null;

  const comFormato = posts.filter((p) => p.formato);
  const grupos = agruparPor(comFormato, (p) => p.formato);
  const porFormato = Object.entries(grupos)
    .map(([formato, itens]) => ({ formato, quantidade: itens.length }))
    .sort((a, b) => b.quantidade - a.quantidade);

  const destaques = posts.filter((p) => typeof p.curtidas === 'number').sort((a, b) => b.curtidas - a.curtidas).slice(0, 6);

  const comFluxo = posts.filter((p) => typeof p.inclusoes === 'number' || typeof p.exclusoes === 'number');
  const inclusoes = comFluxo.length > 0 ? somar(comFluxo.map((p) => (typeof p.inclusoes === 'number' ? p.inclusoes : 0))) : null;
  const exclusoes = comFluxo.length > 0 ? somar(comFluxo.map((p) => (typeof p.exclusoes === 'number' ? p.exclusoes : 0))) : null;

  return { posts: posts.length, seguidoresAtual, engajamentoMedio, porFormato, destaques, inclusoes, exclusoes };
}

function renderizarInsightsTreinamentos() {

      </article>
    `;

  const linhas = [];
  const porTema = calcularTreinamentosPorTema(dadosAtuais, filtrosAtuais);

  if (porTema.status === STATUS_INDICADOR.ATIVO && Array.isArray(porTema.valor) && porTema.valor.length > 0) {
    const top = porTema.valor[0]; // já vem ordenado por participantes, desc
    linhas.push(`<strong>${top.tema}</strong> foi o treinamento com mais participantes em ${filtrosAtuais.mes} (${formatarNumero(null, top.participantes)} pessoas em ${formatarNumero(null, top.turmas)} turma(s)).`);

    const semHoras = porTema.valor.filter((t) => t.horasTotais === 0);
    if (semHoras.length > 0) {
      linhas.push(`Atenção: ${semHoras.map((t) => `<strong>${t.tema}</strong>`).join(', ')} ${semHoras.length > 1 ? 'estão' : 'está'} sem "Horas totais" preenchida na planilha neste mês, os números de horas desses treinamentos ficam subestimados até isso ser corrigido.`);
    }
  }

  try {
    const comp = compararComMesAnterior(calcularHorasPorColaborador, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
    if (comp.variacao && typeof comp.atual.valor === 'number' && typeof comp.anterior.valor === 'number') {
      const subiu = comp.variacao.absoluta >= 0;
      linhas.push(`A intensidade de treinamento por pessoa ${subiu ? 'aumentou' : 'diminuiu'}: de ${formatarNumero(null, comp.anterior.valor)}h para ${formatarNumero(null, comp.atual.valor)}h por colaborador treinado, frente a ${comp.anterior.filtrosAplicados.mes}.`);
    }
  } catch (erro) {
    console.error('Falha ao comparar Horas por Colaborador com o mês anterior:', erro);
  }

  try {
    const comp = compararComMesAnterior(calcularTurmasRealizadas, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
    if (comp.variacao && typeof comp.atual.valor === 'number' && typeof comp.anterior.valor === 'number' && comp.variacao.percentual !== null) {
      const subiu = comp.variacao.absoluta >= 0;
      linhas.push(`O volume de turmas realizadas ${subiu ? 'cresceu' : 'caiu'} ${Math.abs(comp.variacao.percentual).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}% em relação a ${comp.anterior.filtrosAplicados.mes}.`);
    }
  } catch (erro) {
    console.error('Falha ao comparar Turmas Realizadas com o mês anterior:', erro);
  }

  if (linhas.length === 0) {
    return `
      <article class="cartao-indicador tem-tabela insights-card">
        <div class="cartao-cabecalho"><span class="cartao-nome">Principais Insights do Mês</span></div>
        <p class="cartao-observacao">Sem dados suficientes pra gerar uma análise de ${filtrosAtuais.mes}.</p>
      </article>
    `;
  }

  return `
    <article class="cartao-indicador tem-tabela insights-card">
      <div class="cartao-cabecalho"><span class="cartao-nome">Principais Insights do Mês</span></div>
      <ul class="insights-lista">
        ${linhas.map((l) => `<li>${l}</li>`).join('')}
      </ul>
    </article>
  `;
}

/** Linha do tempo de Entregas Estratégicas do DHO, texto direto da planilha, sem nenhuma conta. */
/**
 * Entregas Estratégicas, agrupado por Projeto (era uma timeline solta,
 * pedido da Nayuri 01/09: separar por projeto, mostrar Realizado x A
 * Realizar, e organizar as iniciativas em bullets por mês).
 *
 * A planilha hoje só tem Mês, Projeto, Detalhes e Responsável, não tem
 * coluna de Tema, nem de prazo (Data Prevista / Data Concluída), nem de
 * status Planejado/Realizado. Por isso "A Realizar" e o acompanhamento de
 * prazo aparecem como estrutura pronta e vazia ("Aguardando dados"): assim
 * que essas colunas existirem na planilha, é só preencher, o código já
 * lê `tema`, `tipo` ('realizado'/'planejado'), `dataPrevista` e
 * `dataConcluida` se vierem, sem precisar mexer aqui de novo.
 */
function renderizarEntregasEstrategicas(filtrarPorMes = true) {
  const resultado = calcularEntregasEstrategicas(dadosAtuais);
  if (resultado.status !== STATUS_INDICADOR.ATIVO || !Array.isArray(resultado.valor) || resultado.valor.length === 0) {
    return '';
  }

  const projetos = resultado.valor
    .map((p) => ({
      ...p,
      itens: (filtrarPorMes && filtrosAtuais.mes) ? p.itens.filter((i) => i.mes === filtrosAtuais.mes) : p.itens,
    }))
    .filter((p) => p.itens.length > 0);
  if (projetos.length === 0) return '';

  const agruparPorMes = (itens) => {
    const grupos = {};
    for (const i of itens) {
      if (!grupos[i.mes]) grupos[i.mes] = [];
      grupos[i.mes].push(i);
    }
    return Object.entries(grupos).sort((a, b) => MESES_ORDEM.indexOf(a[0]) - MESES_ORDEM.indexOf(b[0]));
  };

  const projetoCardHtml = (p) => {
    const realizados = p.itens.filter((i) => i.tipo !== 'planejado');
    const planejados = p.itens.filter((i) => i.tipo === 'planejado');
    const resultadoEsperado = p.itens.find((i) => i.resultadoEsperado)?.resultadoEsperado || null;

    const bulletsRealizados = agruparPorMes(realizados).map(([mes, itens]) => `
      <div class="projeto-grupo-mes">
        <span class="projeto-mes-rotulo">${mes}</span>
        <ul class="projeto-bullets">
          ${itens.map((i) => `<li>${i.tema ? `<b>${i.tema}:</b> ` : ''}${i.descricao}${i.responsavel ? ` <span class="projeto-bullet-resp">, ${i.responsavel}</span>` : ''}</li>`).join('')}
        </ul>
      </div>
    `).join('');
    const realizadosHtml = realizados.length > 0 ? `
      <details class="projeto-lista-suspensa">
        <summary>✅ Ver ${realizados.length} entrega${realizados.length === 1 ? '' : 's'} realizada${realizados.length === 1 ? '' : 's'}</summary>
        ${bulletsRealizados}
      </details>
    ` : '';

    const secaoARealizar = planejados.length > 0 ? (() => {
      const bulletsPlanejados = agruparPorMes(planejados).map(([mes, itens]) => `
        <div class="projeto-grupo-mes">
          <span class="projeto-mes-rotulo">${mes}</span>
          <ul class="projeto-bullets">
            ${itens.map((i) => `<li>${i.tema ? `<b>${i.tema}:</b> ` : ''}${i.descricao}${i.dataPrevista ? ` <span class="projeto-prazo">Prazo: ${formatarDataCurta(i.dataPrevista)}</span>` : ''}${i.dataConcluida ? ` <span class="projeto-prazo">Data-alvo: ${formatarDataCurta(i.dataConcluida)}</span>` : ''}</li>`).join('')}
          </ul>
        </div>
      `).join('');
      return `
        <details class="projeto-lista-suspensa"><summary>🗓️ Ver ${planejados.length} entrega${planejados.length === 1 ? '' : 's'} a realizar</summary>${bulletsPlanejados}</details>
      `;
    })() : '';

    return `
      <div class="projeto-card">
        <div class="projeto-cabecalho">
          <h4 class="projeto-nome">${p.projeto}</h4>
          <span class="projeto-contagem">${realizados.length} realizada${realizados.length === 1 ? '' : 's'} · ${planejados.length} a realizar</span>
        </div>
        ${resultadoEsperado ? `<p class="projeto-resultado-esperado">🎯 <b>Resultado que pretende impactar:</b> ${resultadoEsperado}</p>` : ''}
        ${realizadosHtml}
        ${secaoARealizar}
      </div>
    `;
  };

  return `
    <div class="entregas-coluna">
      <h3 class="visao-geral-subtitulo">Entregas Estratégicas</h3>
      <p class="entregas-legenda">Projetos e iniciativas que impulsionam a transformação da Cabana Burger, agrupados por projeto, mês a mês.</p>
      <div class="projetos-grade">
        ${projetos.map(projetoCardHtml).join('')}
      </div>
    </div>
  `;
}

  const icone = item.iconePropio || ICONES_AREA[item.categoria] || '◆';
  const iconeHtml = `<span class="cartao-resumo-icone" style="background:${cor}">${icone}</span>`;

  if (resultado.status !== STATUS_INDICADOR.ATIVO || typeof resultado.valor !== 'number') {
    return `
      <article class="cartao-resumo">
        ${iconeHtml}
        <div class="cartao-resumo-corpo">
          <span class="cartao-resumo-valor valor-indisponivel">${resultado.status === STATUS_INDICADOR.INDISPONIVEL ? 'Indisponível' : 'Aguardando dados'}</span>
          <span class="cartao-resumo-rotulo">${item.rotulo}</span>
        </div>
      </article>
    `;
  }

  const valorFormatado = formatarValorResumo(item, resultado.valor);
  const variacao = obterVariacaoTexto(item, temMes);
  const variacaoHtml = variacao
    ? `<span class="cartao-resumo-variacao ${variacao.subiu ? 'sobe' : 'desce'}">${variacao.seta} ${variacao.texto}</span>`
    : '';

  return `
    <article class="cartao-resumo">
      ${iconeHtml}
      <div class="cartao-resumo-corpo">
        <span class="cartao-resumo-valor">${valorFormatado}</span>
        <span class="cartao-resumo-rotulo">${item.rotulo}</span>
        ${variacaoHtml}
        ${item.notaExtra ? `<span class="cartao-resumo-nota">${item.notaExtra}</span>` : ''}
      </div>
    </article>
  `;
}

function formatarValorResumo(item, valor) {
  if (item.percentual) return `${valor.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
  if (item.percentualFracao) return `${(valor * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
  if (item.emHoraMinuto) return formatarHoraMinuto(valor);
  return valor.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
}

function renderizarGrade() {
  destruirGraficos();

  if (categoriaAtiva === 'todas') {
    elGrade.innerHTML = renderizarVisaoGeral();

  const AREA_POR_CATEGORIA_RS = {
    'Recrutamento & Seleção, Administrativo': 'Administrativo (Gabi)',
    'Recrutamento & Seleção, Operações': 'Operações (Giu)',

  const areaRsAtiva = AREA_POR_CATEGORIA_RS[categoriaAtiva] || null;

  const resultados = areaRsAtiva
    ? Object.values(calcularTodosIndicadores(dadosAtuais, { ...filtrosAtuais, areaAnalista: areaRsAtiva }).resultados)
        .filter((r) => r.categoria === 'Recrutamento & Seleção')
    : Object.values(resultadosAtuais).filter((r) => r.categoria === categoriaAtiva);
  const insightsHtml = categoriaAtiva === 'DHO' ? renderizarInsightsDHO()
    : categoriaAtiva === 'Treinamentos' ? renderizarInsightsTreinamentos()
    : categoriaAtiva === 'Comunicação Interna' ? renderizarInsightsComunicacao()
    : '';

  // Blocos novos (Diário do Cabaneiro, Eventos expandido, Kit de Onboarding)
  // ainda em prévia com dado ilustrativo, ver nota acima das funções.
  const blocosNovosComunicacaoInterna = categoriaAtiva === 'Comunicação Interna' ? `
    ${renderizarDiarioCabaneiro()}
    ${renderizarEventos()}
    ${renderizarKitOnboarding()}
  ` : '';

  // R&S virou duas guias separadas (01/09, pedido da Nayuri: "não é pra
  // misturar as coisas"), cada uma só mostra o próprio recorte de área.
  // Vagas Operacionais (guia nova da Giu, ainda sem dado real) só aparece
  // do lado de Operações.
  const blocosRs = areaRsAtiva ? `
    ${renderizarKpisRecrutamento(areaRsAtiva)}
    ${categoriaAtiva === 'Recrutamento & Seleção, Operações' ? renderizarVagasOperacionais() : ''}
  ` : '';

  // DHO tinha 15 cards soltos numa grade só, sem hierarquia visual, e os 4
  // gráficos de evolução ocupavam a largura toda cada um (empilhados,
  // MUITO espaço vertical), pedido da Nayuri (01/09, "raio-x de layout").
  // Agora: 1) evolução mensal passa a ocupar meia largura (2 por linha em
  // vez de empilhado), 2) a página ganha cabeçalhos de seção.
  const GRUPOS_DHO = [
    { titulo: 'Resumo da Escuta Organizacional', ids: ['pesquisas_por_tipo'] },
  ];

  // NPS & L-NPS por Pesquisa virou 1 card por pesquisa (NPS + L-NPS juntos
  // dentro), não mais 8 velocímetros soltos e idênticos numa fila, ver
  // renderizarBlocoGaugesPesquisa().
  const PARES_GAUGE_PESQUISA = [
    { nome: 'Pesquisa de Desligamento', nps: 'nps_mensal', lnps: 'lnps_mensal' },
    { nome: 'Onboarding 90 dias', nps: 'nps_onboarding_90_mensal', lnps: 'lnps_onboarding_90_mensal' },
    { nome: 'Onboarding 45 dias', nps: 'nps_onboarding_45_mensal', lnps: 'lnps_onboarding_45_mensal' },
    { nome: 'Onboarding 20 dias', nps: 'nps_onboarding_20_mensal', lnps: 'lnps_onboarding_20_mensal' },
  ];
  const blocosGaugesHtml = categoriaAtiva === 'DHO' ? (() => {
    const blocos = PARES_GAUGE_PESQUISA.map((par) => {
      const rNps = resultados.find((r) => r.id === par.nps);
      const rLnps = resultados.find((r) => r.id === par.lnps);
      if (!rNps || !rLnps) return '';
      return renderizarBlocoGaugesPesquisa(par.nome, rNps, rLnps);
    }).filter(Boolean).join('');
    return blocos ? `<h4 class="grupo-dho-titulo">NPS & L-NPS por Pesquisa</h4>${blocos}` : '';
  })() : '';

  // Evolução Mensal, trocado de 4 gráficos de linha por 4 faixas de zona
  // coloridas (pedido da Nayuri 01/09: "gráfico de linha fica massante,
  // difícil de ler"). Cada mês vira uma célula colorida pela zona, sem
  // precisar ler eixo nenhum, só bater o olho na sequência de cores.
  const PARES_EVOLUCAO_PESQUISA = [
    { nome: 'Pesquisa de Desligamento', id: 'nps_evolucao_mensal' },
    { nome: 'Onboarding 90 dias', id: 'nps_onboarding_90_evolucao_mensal' },
    { nome: 'Onboarding 45 dias', id: 'nps_onboarding_45_evolucao_mensal' },
    { nome: 'Onboarding 20 dias', id: 'nps_onboarding_20_evolucao_mensal' },
  ];
  const blocosEvolucaoHtml = categoriaAtiva === 'DHO' ? (() => {
    const blocos = PARES_EVOLUCAO_PESQUISA.map((par) => {
      const r = resultados.find((res) => res.id === par.id);
      if (!r) return '';
      return renderizarBlocoEvolucaoPesquisa(par.nome, r);
    }).filter(Boolean).join('');
    return blocos ? `<h4 class="grupo-dho-titulo">Comparativo Mensal</h4>${blocos}` : '';
  })() : '';

  const IDS_JA_NO_KPI_TREINAMENTOS = new Set(['participantes_treinados', 'turmas_realizadas', 'horas_ministradas', 'dias_dedicados_time']);
  const IDS_JA_NO_KPI_RS = new Set(['vagas_abertas', 'vagas_fechadas', 'sla_fechamento', 'time_to_fill_medio', 'admissoes_loja']);
  const cartoesHtml = categoriaAtiva === 'DHO'
    ? (() => {
        const secoes = GRUPOS_DHO.map((g) => {

    ? resultados.filter((r) => !IDS_JA_NO_KPI_TREINAMENTOS.has(r.id)).map(renderizarCartao).join('')

    ? resultados.filter((r) => !IDS_JA_NO_KPI_RS.has(r.id)).map(renderizarCartao).join('')

  // Na guia de DHO, o Painel de Pesquisas (comparativo + comentários
  // abertos) é leitura de aprofundamento, fica depois da grade de cards.
  // A legenda de zonas subiu pra logo abaixo da intro (pedido da Nayuri
  // 01/09: "já vem com as zonas, com cores"), não fica mais só lá embaixo.
  const painelPesquisasHtml = categoriaAtiva === 'DHO' ? renderizarPainelPesquisas() : '';

  elGrade.innerHTML = `
    <h2 class="categoria-titulo">${NOMES_EXIBICAO_CATEGORIA[categoriaAtiva] || categoriaAtiva}</h2>
    <p class="categoria-descricao">${DESCRICAO_CATEGORIA[categoriaAtiva] || ''}</p>
    ${categoriaAtiva === 'DHO' ? renderizarLegendaZonasNps() : ''}
    ${categoriaAtiva === 'DHO' ? renderizarKpisDho() : ''}

    ${categoriaAtiva === 'Comunicação Interna' ? renderizarKpisComunicacaoInterna() : ''}
