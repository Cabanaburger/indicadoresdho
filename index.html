      ${cartoesHtml}
      ${blocosNovosComunicacaoInterna}
    </div>
    ${painelPesquisasHtml}
    ${insightsHtml}
  `;

  // Os <canvas> só existem no DOM depois do innerHTML acima ser aplicado, e
  // o navegador precisa terminar de posicionar o layout antes do Chart.js
  // medir o tamanho do canvas, por isso esperamos um requestAnimationFrame
  // em vez de criar os gráficos na mesma tarefa síncrona.
  requestAnimationFrame(() => {
    for (const r of resultados) {
      try {
        criarGraficoSeAplicavel(r);
      } catch (erro) {
        console.error(`Falha ao criar o gráfico do indicador "${r.id}":`, erro);
        mostrarFallbackDeGrafico(r);
      }
    }
  });
}

/**
 * Selo "vs. mês anterior" dentro do card, pedido da Nayuri (01/09) pros
 * indicadores de SLA: sempre mostrar a diferença em relação ao mês
 * passado, sem precisar abrir "Ver auditoria" ou olhar o gráfico.
 * IDS_MENOR_MELHOR marca os que são bons quando o número CAI (dias) —
 * pro resto (%), maior é melhor.
 */
const IDS_COM_DELTA_MES = new Set(['sla_fechamento', 'sla_vagas_dias_medio', 'time_to_fill_medio', 'time_to_hire_medio', 'aging_medio']);
const IDS_MENOR_MELHOR = new Set(['sla_vagas_dias_medio', 'time_to_fill_medio', 'time_to_hire_medio', 'aging_medio']);

function renderizarDeltaMesAnterior(r) {
  if (!IDS_COM_DELTA_MES.has(r.id) || !filtrosAtuais.mes) return '';
  const fnCalc = MAPA_INDICADORES_POR_ID[r.id];
  if (!fnCalc) return '';
  let comparacao;
  try {
    comparacao = compararComMesAnterior(fnCalc, dadosAtuais, filtrosAtuais.mes, filtrosAtuais.ano ?? null);
  } catch {
    return '';
  }
  if (!comparacao.variacao || typeof comparacao.anterior.valor !== 'number') return '';

  const absoluta = comparacao.variacao.absoluta;
  const subiu = absoluta >= 0;
  const menorMelhor = IDS_MENOR_MELHOR.has(r.id);
  const favoravel = menorMelhor ? !subiu : subiu;
  const estavel = Math.abs(absoluta) < 0.05;
  const seta = estavel ? '＝' : subiu ? '▲' : '▼';
  const cor = estavel ? 'var(--texto-fraco)' : favoravel ? 'var(--cb-verde-escuro)' : '#C0472A';
  const sufixo = IDS_PERCENTUAIS.has(r.id) ? 'pp' : IDS_DIAS.has(r.id) ? 'd' : '';
  const textoValor = `${Math.abs(absoluta).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}${sufixo}`;
  const idxAnterior = (MESES_ORDEM.findIndex((m) => normalizarChave(m) === normalizarChave(filtrosAtuais.mes)) - 1 + 12) % 12;
  const mesAnterior = MESES_ORDEM[idxAnterior];
  return `<p class="cartao-delta-mes" style="color:${cor}">${seta} ${textoValor} vs. ${mesAnterior}</p>`;
}

function renderizarCartao(r) {
  const temGrafico = deveExibirComoGrafico(r);
  const temTabela = IDS_TABELA.has(r.id) && Array.isArray(r.valor) && r.valor.length > 0;
  const temCartoesTreino = IDS_CARTOES_TREINO.has(r.id) && Array.isArray(r.valor) && r.valor.length > 0;
  const temCartoesPesquisa = IDS_CARTOES_PESQUISA.has(r.id) && Array.isArray(r.valor) && r.valor.length > 0;
  const temHeatmap = IDS_HEATMAP.has(r.id) && r.valor && r.valor.linhas && r.valor.linhas.length > 0;
  const ocupaLargaTotal = temTabela || temCartoesTreino || temHeatmap;
  const ehLinhaSerie = temGrafico && CONFIG_GRAFICO_POR_INDICADOR[r.id].tipo === 'linha-serie';
  return `
    <article class="cartao-indicador ${temGrafico ? 'tem-grafico' : ''} ${ehLinhaSerie ? 'tem-grafico-largo' : ''} ${ocupaLargaTotal ? 'tem-tabela' : ''} ${temCartoesPesquisa ? 'tem-cartoes-pesquisa' : ''}">
      <div class="cartao-cabecalho">
        <span class="cartao-nome">${r.nome}</span>
        <span class="selo-status ${r.status}">${rotuloStatus(r.status)}</span>
      </div>

      ${renderizarValor(r, temGrafico)}

      ${renderizarDeltaMesAnterior(r)}

      ${r.observacoes && r.id !== 'admissoes_loja' ? `<p class="cartao-observacao">${r.observacoes}</p>` : ''}

      <details class="cartao-auditoria">
        <summary>Ver auditoria</summary>
        <dl class="cartao-auditoria-corpo">
          <dt>Aba de origem</dt><dd>${r.abaOrigem}</dd>
          <dt>Colunas utilizadas</dt><dd>${(r.colunasUtilizadas || []).join(', ') || ','}</dd>
          <dt>Fórmula</dt><dd>${r.formula}</dd>
          <dt>Periodicidade</dt><dd>${r.periodicidade}</dd>
          <dt>Registros utilizados</dt><dd>${r.registrosUtilizados}</dd>
          <dt>Filtros aplicados</dt><dd>${Object.keys(r.filtrosAplicados).length ? JSON.stringify(r.filtrosAplicados) : 'nenhum'}</dd>
        </dl>
      </details>
    </article>
  `;
}

  if (status === STATUS_INDICADOR.ATIVO) return 'Ativo';
  if (status === STATUS_INDICADOR.AGUARDANDO_DADOS) return 'Aguardando dados';
  return 'Indisponível';
}

function chartJsDisponivel() {

let pluginRotulosRegistrado = false;

/**
 * Registra, uma única vez, um plugin do Chart.js que desenha o valor
 * numérico em cima de cada barra/fatia/ponto, pedido explícito: "todos os
 * gráficos, independente do formato, devem conter os números".
 */
function garantirPluginDeRotulos() {
  if (pluginRotulosRegistrado || !chartJsDisponivel()) return;
  Chart.register({
    id: 'rotulosDeValor',
    afterDatasetsDraw(chart) {
      const { ctx } = chart;
      ctx.save();
      ctx.font = "700 11px 'Avenir Next', sans-serif";
      chart.data.datasets.forEach((dataset, datasetIndex) => {
        const meta = chart.getDatasetMeta(datasetIndex);
        if (meta.hidden) return;
        meta.data.forEach((elemento, index) => {
          const valorBruto = dataset.data[index];
          if (valorBruto === null || valorBruto === undefined) return;
          const texto = typeof valorBruto === 'number'
            ? valorBruto.toLocaleString('pt-BR', { maximumFractionDigits: 1 })
            : String(valorBruto);
          const pos = typeof elemento.tooltipPosition === 'function' ? elemento.tooltipPosition() : elemento.getCenterPoint();

          if (chart.config.type === 'doughnut' || chart.config.type === 'pie') {
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(texto, pos.x, pos.y);
          } else if (chart.config.type === 'line') {
            const corTexto = corLegivelParaTexto(dataset.borderColor) || '#24301F';
            const y = pos.y - 10 - datasetIndex * 16;
            const largura = ctx.measureText(texto).width;
            const paddingH = 4;
            const alturaFundo = 15;
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(pos.x - largura / 2 - paddingH, y - alturaFundo + 3, largura + paddingH * 2, alturaFundo);
            ctx.fillStyle = corTexto;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(texto, pos.x, y);
          } else if (chart.options.indexAxis === 'y') {
            ctx.fillStyle = '#24301F';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(texto, pos.x + 6, pos.y);
          } else {
            ctx.fillStyle = '#24301F';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(texto, pos.x, pos.y - 4);
          }
        });
      });
      ctx.restore();
    },
  });
  pluginRotulosRegistrado = true;
}

function deveExibirComoGrafico(r) {
  if (!chartJsDisponivel()) return false;
  if (r.status !== STATUS_INDICADOR.ATIVO) return false;
  const config = CONFIG_GRAFICO_POR_INDICADOR[r.id];
  if (!config) return false;
  const valor = r.valor;
  if (Array.isArray(valor)) return valor.length > 0;
  if (valor && typeof valor === 'object') return Object.keys(valor).length > 0;
  return false;
}

function renderizarValor(r, temGrafico) {
  if (r.status === STATUS_INDICADOR.INDISPONIVEL) {
    return `<div class="cartao-valor valor-indisponivel">Indisponível</div>`;
  }
  // Aguardando dados: sempre mostra o mesmo aviso, nunca uma lista de zeros
  // por baixo (isso confundia mais do que ajudava).
  if (r.status === STATUS_INDICADOR.AGUARDANDO_DADOS) {
    return `<div class="cartao-valor valor-indisponivel">Aguardando dados</div>`;
  }
  if (temGrafico) {
    const alturaClasse = ['linha-serie', 'linha-nps'].includes(CONFIG_GRAFICO_POR_INDICADOR[r.id].tipo) ? 'grafico-linha' : '';
    return `<div class="grafico-container ${alturaClasse}" id="grafico-container-${r.id}"><canvas id="grafico-${r.id}"></canvas></div>`;
  }
  if (IDS_HEATMAP.has(r.id)) {
    if (!r.valor || !r.valor.linhas || r.valor.linhas.length === 0) {
      return `<div class="cartao-valor valor-indisponivel">Nenhum registro no período selecionado</div>`;
    }
    return renderizarHeatmap(r.valor);
  }
  if (IDS_CARTOES_PESQUISA.has(r.id)) {
    if (!Array.isArray(r.valor) || r.valor.length === 0) {
      return `<div class="cartao-valor valor-indisponivel">Nenhum registro no período selecionado</div>`;
    }
    return renderizarCartoesPesquisa(r.valor);
  }
  if (IDS_CARTOES_TREINO.has(r.id)) {
    if (!Array.isArray(r.valor) || r.valor.length === 0) {
      return `<div class="cartao-valor valor-indisponivel">Nenhum registro no período selecionado</div>`;
    }
    return renderizarCartoesTreino(r.id, r.valor);
  }
  if (IDS_TABELA.has(r.id)) {
    if (!Array.isArray(r.valor) || r.valor.length === 0) {
      return `<div class="cartao-valor valor-indisponivel">Nenhum registro no período selecionado</div>`;
    }
    return renderizarTabela(r.valor);
  }
  if (IDS_GAUGE_NPS.has(r.id) && typeof r.valor === 'number') {
    return renderizarGaugeNps(r.valor, r.id.includes('lnps') ? 'L-NPS®' : 'NPS®');
  }
  if (typeof r.valor === 'number') {
    if (r.id === 'admissoes_loja') {
      return `<div class="cartao-valor cartao-valor-com-nota">${formatarNumero(r.id, r.valor)}<span class="cartao-nota-inline">Processo descentralizado</span></div>`;
    }
    const numero = `<div class="cartao-valor">${formatarNumero(r.id, r.valor)}</div>`;
    if (Array.isArray(r.detalhe) && r.detalhe.length > 0 && r.detalhe[0] && typeof r.detalhe[0] === 'object' && 'nome' in r.detalhe[0]) {
      const lista = `<ul class="lista-distribuicao">${r.detalhe.map((item) => `<li><span>${item.nome}</span><span>${item.mes || ''}</span></li>`).join('')}</ul>`;
      return numero + lista;
    }
    return numero;
  }
  if (Array.isArray(r.valor)) {
    return `<ul class="lista-distribuicao">${r.valor.slice(0, 8).map(renderizarLinhaDistribuicao).join('')}</ul>`;
  }
  if (r.valor && typeof r.valor === 'object') {
    return `<ul class="lista-distribuicao">${Object.entries(r.valor).map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join('')}</ul>`;
  }
  return `<div class="cartao-valor valor-indisponivel">,</div>`;
}

      <div class="mini-cartao-treino">

        ${item.observacoes.length > 0 ? `<p class="mini-cartao-obs">${item.observacoes.join(' · ')}</p>` : ''}
        <div class="mini-cartao-stats">
          <div><span class="stat-numero">${formatarNumero(null, item.turmas)}</span><span class="stat-rotulo">Turmas</span></div>

  const totalHoras = itens.reduce((acc, i) => acc + (i.horasTotais || 0), 0);

      <div class="mini-cartao-stats">
        <div><span class="stat-numero">${formatarNumero(null, totalVisitas)}</span><span class="stat-rotulo">Visitas</span></div>
        <div><span class="stat-numero">${formatarNumero(null, totalHoras)}</span><span class="stat-rotulo">Horas</span></div>

      </div>
    </div>

  return `<div class="mini-cartoes-treino">${itens.map((item) => `

      <div class="mini-cartao-cabecalho"><strong>${item.tema}</strong><span class="mini-badge visita">Visita pós-treino</span></div>
      <div class="mini-cartao-stats">
        <div><span class="stat-numero">${formatarNumero(null, item.visitas)}</span><span class="stat-rotulo">Visitas</span></div>
        <div><span class="stat-numero">${formatarNumero(null, item.horasTotais)}</span><span class="stat-rotulo">Horas</span></div>
        <div><span class="stat-numero">${formatarNumero(null, item.diasDedicados)}</span><span class="stat-rotulo">Dias</span></div>
      </div>
      <p class="mini-cartao-lojas"><strong>Lojas visitadas:</strong> ${item.lojas || ','}</p>

}

/**
 * Um mini-cartão por tipo de pesquisa (Onboarding 45 dias, 90 dias,

 */
function renderizarCartoesPesquisa(itens) {
  return `<div class="mini-cartoes-treino mini-cartoes-compactas">${itens.map((item) => `
    <div class="mini-cartao-treino mini-cartao-compacto">
      <div class="mini-cartao-cabecalho"><strong>${item.tipo}</strong></div>
      <div class="mini-cartao-stats">
        <div><span class="stat-numero">${formatarNumero(null, item.enviados)}</span><span class="stat-rotulo">Enviados</span></div>

      </div>

function renderizarTabela(itens) {
  const colunas = Object.keys(itens[0]);
  const cabecalho = colunas.map((c) => `<th>${ROTULOS_COLUNA[c] || c}</th>`).join('');
  const linhas = itens.map((item) => `<tr>${colunas.map((c) => `<td>${formatarCelulaTabela(c, item[c])}</td>`).join('')}</tr>`).join('');
  return `<div class="tabela-scroll"><table class="tabela-indicador"><thead><tr>${cabecalho}</tr></thead><tbody>${linhas}</tbody></table></div>`;
}

const COLUNAS_PERCENTUAIS_TABELA = new Set(['percFechamentoPrazo', 'percNoPrazo']);

function formatarCelulaTabela(coluna, valor) {
  if (valor === null || valor === undefined || valor === '') return ',';
  if (coluna === 'engajamento' && typeof valor === 'number') {
    return `${(valor * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
  }
  if (COLUNAS_PERCENTUAIS_TABELA.has(coluna) && typeof valor === 'number') {
    return `${valor.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
  }
  if (typeof valor === 'number') return valor.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  return valor;
}

function renderizarLinhaDistribuicao(item) {
  const chaves = Object.keys(item);
  const rotulo = item[chaves[0]];
  const valor = item[chaves[1]];
  return `<li><span>${rotulo}</span><span>${typeof valor === 'number' ? formatarNumero(null, valor) : valor}</span></li>`;
}

/**
 * criarGraficoComparativoMensal() foi removida (o gráfico "Comparativo

 */

/**
 * Gauge (velocímetro) de NPS/L-NPS, -100 a +100, mesmo estilo do NPS
 * oficial que a Silvana mandou de referência. Desenhado em SVG (Chart.js
 * não tem tipo "gauge" nativo); o valor em si continua vindo pronto de
 * metrics.js, aqui só decide onde desenhar o marcador no arco.
 */
/**
 * Zonas de qualidade de NPS/L-NPS, regra oficial do Panorama de EX da Pin
 * People (2026), pedido da Nayuri (01/09) pra aparecer sempre junto do
 * número, em todo lugar que mostra NPS/eNPS/L-NPS.
 */
function obterZonaNps(valor) {
  if (valor < 0) return { nome: 'Crítica', cor: '#E86943', corClara: '#FCEAE3' };
  if (valor < 50) return { nome: 'Aperfeiçoamento', cor: '#FAB515', corClara: '#FEF3D9' };
  if (valor < 75) return { nome: 'Qualidade', cor: '#08A3C1', corClara: '#E3F5F8' };
  return { nome: 'Excelência', cor: '#53A246', corClara: '#EAF4E6' };
}

/** Legenda compartilhada das zonas de NPS, cita a fonte (Panorama de EX, Pin People), pra não repetir isso em cada gauge. */
function renderizarLegendaZonasNps() {
  const zonas = [
    { nome: 'Crítica', faixa: '-100 a -1', cor: '#E86943' },
    { nome: 'Aperfeiçoamento', faixa: '0 a +49', cor: '#FAB515' },
    { nome: 'Qualidade', faixa: '+50 a +74', cor: '#08A3C1' },
    { nome: 'Excelência', faixa: 'a partir de +75', cor: '#53A246' },

  return `
    <div class="zona-nps-legenda">
      ${zonas.map((z) => `<span class="zona-nps-legenda-item"><span class="zona-nps-legenda-ponto" style="background:${z.cor}"></span>${z.nome} (${z.faixa})</span>`).join('')}
      <span class="zona-nps-legenda-fonte">Zonas de qualidade de NPS, regra do Panorama de EX, Pin People (2026)</span>
    </div>
  `;
}

/** Zonas de qualidade de Favorabilidade (%), mesma fonte (Panorama de EX, Pin People), só que com 3 faixas em vez de 4. */
function obterZonaFavorabilidade(perc) {
  if (perc < 60) return { nome: 'Crítica', cor: '#E86943' };
  if (perc < 75) return { nome: 'Qualidade', cor: '#08A3C1' };
  return { nome: 'Excelência', cor: '#53A246' };
}

/**
 * Painel de Pesquisas, pedido da Nayuri (01/09): comparar as 4 pesquisas
 * entre si nas perguntas que se repetem, mês a mês (o que evolui, o que
 * não resolve), mostrar os itens que só existem numa pesquisa, e um
 * raio-x dos temas mais citados nos comentários abertos.
 */
function renderizarPainelPesquisas() {
  const temas = dadosAtuais.pesquisasTemas || [];
  const unicos = dadosAtuais.pesquisasItensUnicos || [];
  const abertos = dadosAtuais.pesquisasTemasAbertos || [];
  if (temas.length === 0) return '';

  const PESQUISAS = ['20 dias', '45 dias', '90 dias', 'Desligamento'];
  const nomesTema = [...new Set(temas.map((t) => t.tema))];
  const mesFiltro = filtrosAtuais.mes || null;

  // Respeita o filtro de mês do topo, sem isso, "Agosto" selecionado
  // continuava mostrando os meses todos aqui (bug apontado pela Nayuri em
  // 01/09). Sem filtro (Todos os meses), mostra o mês mais recente com
  // dado, igual antes.
  const ultimoEAnterior = (pesquisa, tema) => {
    const registros = temas.filter((t) => t.tema === tema && t.pesquisa === pesquisa)
      .sort((a, b) => MESES_ORDEM.indexOf(a.mes) - MESES_ORDEM.indexOf(b.mes));
    if (registros.length === 0) return null;
    if (mesFiltro) {
      const idx = registros.findIndex((r) => r.mes === mesFiltro);
      if (idx === -1) return null;
      return { ultimo: registros[idx], anterior: idx > 0 ? registros[idx - 1] : null };
    }
    const ultimo = registros[registros.length - 1];
    const anterior = registros.length > 1 ? registros[registros.length - 2] : null;
    return { ultimo, anterior };
  };

  const linhasTabela = nomesTema.map((tema) => {
    const celulas = PESQUISAS.map((pesquisa) => {
      const par = ultimoEAnterior(pesquisa, tema);
      if (!par) return `<td class="painel-celula-vazia">,</td>`;
      const { ultimo, anterior } = par;
      const zona = obterZonaFavorabilidade(ultimo.percFavoravel);
      const delta = anterior ? Math.round((ultimo.percFavoravel - anterior.percFavoravel) * 10) / 10 : null;
      const seta = delta === null ? '' : delta > 0 ? `<span class="painel-seta sobe">▲ ${delta}pp</span>` : delta < 0 ? `<span class="painel-seta desce">▼ ${Math.abs(delta)}pp</span>` : `<span class="painel-seta estavel">＝</span>`;
      return `<td><span class="painel-valor" style="color:${obterZonaFavorabilidade(ultimo.percFavoravel).cor}">${ultimo.percFavoravel.toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%</span> ${seta}<br><span class="painel-meta-cel">${ultimo.mes} · n=${ultimo.respondentes}</span></td>`;
    });
    return `<tr><td class="painel-tema-nome">${tema}</td>${celulas.join('')}</tr>`;
  }).join('');

  // Itens que só existem numa pesquisa, sem base comparativa, mas ainda
  // importam. Respeita o filtro de mês (mesma correção de cima); sem
  // filtro, mostra o mês mais recente de cada pesquisa/item, não todos.
  const unicosFiltrados = mesFiltro
    ? unicos.filter((u) => u.mes === mesFiltro)
    : Object.values(
        unicos.reduce((acc, u) => {
          const chave = `${u.pesquisa}|${u.item}`;
          if (!acc[chave] || MESES_ORDEM.indexOf(u.mes) > MESES_ORDEM.indexOf(acc[chave].mes)) acc[chave] = u;
          return acc;
        }, {})
      );
  const cardsUnicos = unicosFiltrados.map((u) => {
    const dist = Object.entries(u.distribuicao).sort((a, b) => b[1] - a[1]);
    return `
      <div class="painel-unico-card">
        <p class="painel-unico-titulo">${u.item} <span class="painel-meta-cel">(${u.pesquisa} · ${u.mes})</span></p>
        <div class="painel-unico-barras">
          ${dist.map(([rotulo, qtd]) => `
            <div class="painel-unico-linha">
              <span>${rotulo}</span>
              <div class="painel-unico-trilho"><div class="painel-unico-barra" style="width:${Math.round((qtd / u.respondentes) * 100)}%"></div></div>
              <span>${qtd}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }).join('') || '<p class="cartao-observacao">Nenhum registro no mês selecionado.</p>';

  // Temas mais citados nos comentários abertos, respeita o filtro; sem
  // filtro, usa o mês mais recente de cada pesquisa, pra ficar acionável.
  const paletaTemas = { 'Liderança': '#E86943', 'Reconhecimento': '#FAB515', 'Comunicação': '#08A3C1', 'Treinamento': '#53A246', 'Acolhimento/Equipe': '#993198', 'Ambiente/Clima': '#2E5E33', 'Remuneração/Benefícios': '#7A5B00', 'Processos/Organização': '#1F6B7A', 'Assédio/Abuso': '#C0472A' };
  const blocosAbertos = PESQUISAS.map((pesquisa) => {
    const registros = abertos.filter((a) => a.pesquisa === pesquisa);
    if (registros.length === 0) return '';
    const mesAlvo = mesFiltro || registros.map((r) => r.mes).sort((a, b) => MESES_ORDEM.indexOf(b) - MESES_ORDEM.indexOf(a))[0];
    const doMes = registros.filter((r) => r.mes === mesAlvo).sort((a, b) => b.mencoes - a.mencoes);
    if (doMes.length === 0) return '';
    const maxMencoes = Math.max(...doMes.map((r) => r.mencoes), 1);
    return `
      <div class="painel-abertos-bloco">
        <p class="painel-unico-titulo">${pesquisa} <span class="painel-meta-cel">(${mesAlvo})</span></p>
        ${doMes.map((r) => `
          <div class="painel-unico-linha">
            <span>${r.tema}</span>
            <div class="painel-unico-trilho"><div class="painel-unico-barra" style="width:${Math.round((r.mencoes / maxMencoes) * 100)}%;background:${paletaTemas[r.tema] || 'var(--cb-verde)'}"></div></div>
            <span>${r.mencoes}</span>
          </div>
        `).join('')}
      </div>
    `;
  }).join('');

  return `
    <article class="cartao-indicador tem-tabela" style="grid-column:1/-1">
      <div class="cartao-cabecalho">
        <span class="cartao-nome">🔎 Painel de Pesquisas, comparativo entre 20d, 45d, 90d e Desligamento</span>
      </div>
      <p class="cartao-observacao" style="margin-top:-6px">Junta as perguntas que se repetem nas quatro pesquisas de experiência do colaborador, pra comparar o mesmo tema entre etapas diferentes da jornada e acompanhar se está melhorando ou piorando mês a mês.</p>
      <div class="painel-tabela-wrap">
        <table class="painel-tabela">
          <thead><tr><th>Tema</th>${PESQUISAS.map((p) => `<th>${p}</th>`).join('')}</tr></thead>
          <tbody>${linhasTabela}</tbody>
        </table>
      </div>
      <p class="cartao-observacao">% de respostas favoráveis (nota 4 ou 5, ou "Sim"). Seta compara com o mês anterior da mesma pesquisa. Cor segue a zona de favorabilidade (Panorama de EX, Pin People): abaixo de 60% Crítica, 60 a 74,9% Qualidade, a partir de 75% Excelência.</p>

      <h4 style="margin-top:22px">Perguntas exclusivas de cada pesquisa</h4>
      <div class="painel-unicos-grid">${cardsUnicos}</div>

      <h4 style="margin-top:22px">O que os comentários abertos mais citam (mês mais recente de cada pesquisa)</h4>
      <div class="painel-abertos-grid">${blocosAbertos}</div>
    </article>
  `;
}

/**
 * Gauge (velocímetro) de NPS/L-NPS, -100 a +100, com as 4 zonas de
 * qualidade do Panorama de EX da Pin People (Crítica/Aperfeiçoamento/
 * Qualidade/Excelência), cada uma com sua cor e um selo de zona embaixo do
 * número, mesmo estilo do exemplo que a Nayuri mandou (01/09).
 */
function renderizarGaugeNps(valor, rotulo) {
  const raio = 90;
  const p100n = calcularPontoGauge(-100, raio);
  const p0 = calcularPontoGauge(0, raio);
  const p50 = calcularPontoGauge(50, raio);
  const p75 = calcularPontoGauge(75, raio);
  const p100 = calcularPontoGauge(100, raio);
  const pPonteiroExt = calcularPontoGauge(valor, raio + 4);
  const pPonteiroInt = calcularPontoGauge(valor, raio - 22);
  const zona = obterZonaNps(valor);

  const arco = (a, b, cor) => `<path d="M ${a.x.toFixed(1)} ${a.y.toFixed(1)} A ${raio} ${raio} 0 0 1 ${b.x.toFixed(1)} ${b.y.toFixed(1)}" stroke="${cor}" stroke-width="20" fill="none" stroke-linecap="round" />`;

  return `
    <div class="gauge-nps">
      <svg viewBox="0 0 200 112" class="gauge-svg">
        ${arco(p100n, p0, '#E86943')}
        ${arco(p0, p50, '#FAB515')}
        ${arco(p50, p75, '#08A3C1')}
        ${arco(p75, p100, '#53A246')}
        <line x1="${pPonteiroInt.x.toFixed(1)}" y1="${pPonteiroInt.y.toFixed(1)}" x2="${pPonteiroExt.x.toFixed(1)}" y2="${pPonteiroExt.y.toFixed(1)}" stroke="#2B2B2B" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="100" cy="100" r="5" fill="#2B2B2B" />
        <text x="10" y="111" font-size="11" fill="#75796F" font-family="'Avenir Next', sans-serif">-100</text>
        <text x="100" y="9" font-size="11" fill="#75796F" text-anchor="middle" font-family="'Avenir Next', sans-serif">0</text>
        <text x="190" y="111" font-size="11" fill="#75796F" text-anchor="end" font-family="'Avenir Next', sans-serif">+100</text>
      </svg>
      <div class="gauge-numero" style="color:${corLegivelParaTexto(zona.cor)}">${formatarNumero(null, valor)}</div>

      <span class="gauge-zona-selo" style="background:${zona.cor}20;color:${corLegivelParaTexto(zona.cor)}">Zona ${zona.nome}</span>
    </div>
  `;
}

/**
 * Um card por pesquisa, com NPS e L-NPS lado a lado, pedido da Nayuri
 * (01/09): 8 velocímetros soltos e iguaizinhos numa fila ficava confuso
 * pra saber qual pertencia a qual pesquisa. Agora cada pesquisa é UM card
 * só, com nome próprio, e os dois números dela dentro.
 */
function renderizarBlocoGaugesPesquisa(nomePesquisa, resultadoNps, resultadoLnps) {
  const gaugeOuVazio = (resultado, rotulo) => {
    if (resultado.status === STATUS_INDICADOR.ATIVO && typeof resultado.valor === 'number') {
      return renderizarGaugeNps(resultado.valor, rotulo);
    }
    return `<div class="gauge-nps"><div class="cartao-valor valor-indisponivel">Aguardando dados</div><div class="gauge-rotulo">${rotulo}</div></div>`;
  };
  return `
    <article class="cartao-indicador tem-grafico bloco-gauges-pesquisa">
      <div class="cartao-cabecalho">
        <span class="cartao-nome">${nomePesquisa}</span>
      </div>
      <div class="bloco-gauges-par">
        ${gaugeOuVazio(resultadoNps, 'NPS®')}
        ${gaugeOuVazio(resultadoLnps, 'L-NPS® (Liderança)')}
      </div>
    </article>
  `;
}

/**
 * Uma linha (NPS ou L-NPS) da faixa de evolução: um retângulo colorido por
 * mês, na cor da zona daquele valor, dá pra ler a tendência sem precisar
 * decifrar eixo nenhum, só olhar a sequência de cores.
 */
function renderizarFaixaZonaEvolucao(serie, rotulo, campo) {
  return `
    <div class="faixa-evolucao-linha">
      <span class="faixa-evolucao-rotulo">${rotulo}</span>
      <div class="faixa-evolucao-celulas">
        ${serie.map((s) => {
          const valor = s[campo];
          const zona = obterZonaNps(valor);
          return `
            <div class="faixa-evolucao-celula" style="background:${zona.cor}" title="${zona.nome}">
              <span class="faixa-evolucao-mes">${s.mes.slice(0, 3)}</span>
              <span class="faixa-evolucao-valor">${formatarNumero(null, valor)}</span>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/**
 * Um card por pesquisa com a evolução mensal, pedido da Nayuri (01/09):
 * gráfico de linha "fica massante, difícil de ler". Trocado por faixas de
 * células coloridas (NPS numa linha, L-NPS na outra), mesma lógica de cor
 * das zonas usada no resto da página inteira.
 */
function renderizarBlocoEvolucaoPesquisa(nomePesquisa, resultado) {
  if (resultado.status !== STATUS_INDICADOR.ATIVO || !Array.isArray(resultado.valor) || resultado.valor.length === 0) {
    return `
      <article class="cartao-indicador tem-grafico bloco-evolucao-pesquisa">
        <div class="cartao-cabecalho"><span class="cartao-nome">${nomePesquisa}</span></div>
        <div class="cartao-valor valor-indisponivel">Aguardando dados</div>
      </article>
    `;
  }
  const serie = resultado.valor;
  const ultimo = serie[serie.length - 1];
  return `
    <article class="cartao-indicador tem-grafico bloco-evolucao-pesquisa">
      <div class="cartao-cabecalho">
        <span class="cartao-nome">${nomePesquisa}</span>
      </div>
      ${renderizarFaixaZonaEvolucao(serie, 'NPS', 'nps')}
      ${renderizarFaixaZonaEvolucao(serie, 'L-NPS', 'lnps')}
      <p class="cartao-observacao">Respondentes em ${ultimo.mes}: ${ultimo.respondentes}</p>
    </article>
  `;
}

/** Ponto no arco do gauge pra um valor de -100 a +100, com raio dado (centro em 100,100). */
function calcularPontoGauge(valor, raio) {
  const limitado = Math.max(-100, Math.min(100, valor));
  const anguloGraus = 180 - 0.9 * (limitado + 100); // 180° em -100, 90° em 0, 0° em +100
  const anguloRad = (anguloGraus * Math.PI) / 180;
  return { x: 100 + raio * Math.cos(anguloRad), y: 100 - raio * Math.sin(anguloRad) };
}

/**
 * Heatmap (mapa de calor) via CSS grid, Tipo x Mês, com o número sempre
 * visível em cada célula. Cor mais escura = mais participantes naquele mês.
 */
function renderizarHeatmap(valor) {
  const { meses, linhas } = valor;
  const todosValores = linhas.flatMap((l) => l.valores.map((v) => v.valor));
  const maxValor = Math.max(...todosValores, 1);

  const colunas = `130px repeat(${meses.length}, 1fr)`;
  let corpo = `<div class="heatmap-celula-cabecalho"></div>`;
  corpo += meses.map((m) => `<div class="heatmap-celula-cabecalho">${m.slice(0, 3)}</div>`).join('');

  for (const linha of linhas) {
    corpo += `<div class="heatmap-celula-linha">${linha.tipo}</div>`;
    corpo += linha.valores.map((v) => {
      const intensidade = maxValor > 0 ? v.valor / maxValor : 0;
      const cor = corIntensidadeHeatmap(intensidade);
      const corTexto = intensidade > 0.55 ? '#FFFFFF' : '#20261F';
      return `<div class="heatmap-celula" style="background:${cor};color:${corTexto}" title="${linha.tipo}, ${v.mes}: ${v.valor} participantes">${v.valor}</div>`;
    }).join('');
  }

  return `<div class="heatmap-container"><div class="heatmap-grid" style="grid-template-columns:${colunas}">${corpo}</div></div>`;
}

function corIntensidadeHeatmap(t) {
  const claro = [234, 244, 230];
  const escuro = [46, 94, 51];
  const r = Math.round(claro[0] + (escuro[0] - claro[0]) * t);
  const g = Math.round(claro[1] + (escuro[1] - claro[1]) * t);
  const b = Math.round(claro[2] + (escuro[2] - claro[2]) * t);
  return `rgb(${r}, ${g}, ${b})`;
}

function criarGraficoSeAplicavel(r) {
  if (!deveExibirComoGrafico(r)) return;
  const canvas = document.getElementById(`grafico-${r.id}`);
  if (!canvas) return;
  garantirPluginDeRotulos();

  const config = CONFIG_GRAFICO_POR_INDICADOR[r.id];
  const opcoesComuns = {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 16, right: 24 } },
    plugins: { legend: { display: ['rosca', 'pizza', 'linha-serie', 'linha-nps'].includes(config.tipo), labels: { font: { family: "'Avenir Next', sans-serif" } } } },
  };

  let configuracaoChart;

  if (config.tipo === 'linha-serie') {
    const serie = r.valor;
    configuracaoChart = {
      type: 'line',
      data: {
        labels: serie.map((s) => s.mes),
        datasets: [
          { label: 'Treinamentos', data: serie.map((s) => s.treinamentos), borderColor: PALETA_GRAFICO[0], backgroundColor: PALETA_GRAFICO[0], tension: 0.3, yAxisID: 'y1' },
          { label: 'Participantes', data: serie.map((s) => s.participantes), borderColor: PALETA_GRAFICO[1], backgroundColor: PALETA_GRAFICO[1], tension: 0.3, yAxisID: 'y' },
          { label: 'Horas', data: serie.map((s) => s.horas), borderColor: PALETA_GRAFICO[2], backgroundColor: PALETA_GRAFICO[2], tension: 0.3, yAxisID: 'y' },
        ],
      },
      options: {
        ...opcoesComuns,
        layout: { padding: { top: 28, bottom: 6 } },
        scales: {
          y: { position: 'left', title: { display: true, text: 'Participantes / Horas' } },
          y1: { position: 'right', title: { display: true, text: 'Treinamentos' }, grid: { drawOnChartArea: false } },
        },
      },
    };
  } else if (config.tipo === 'linha-nps') {
    // Só NPS e L-NPS no gráfico, "Respondentes" saiu por pedido da Nayuri
    // (01/09): numa escala tão diferente (unidades vs. -100 a 100), o eixo
    // secundário deixava o gráfico confuso de ler. A contagem de
    // respondentes por mês continua visível, como nota abaixo do gráfico
    // (ver `observacoes` nas funções calcularNps*EvolucaoMensal).
    const serie = r.valor;
    configuracaoChart = {
      type: 'line',
      data: {
        labels: serie.map((s) => s.mes),
        datasets: [
          { label: 'NPS', data: serie.map((s) => s.nps), borderColor: PALETA_GRAFICO[0], backgroundColor: PALETA_GRAFICO[0], tension: 0.3, yAxisID: 'y' },
          { label: 'L-NPS (Liderança)', data: serie.map((s) => s.lnps), borderColor: PALETA_GRAFICO[4], backgroundColor: PALETA_GRAFICO[4], tension: 0.3, yAxisID: 'y' },
        ],
      },
      options: {
        ...opcoesComuns,
        layout: { padding: { top: 28, bottom: 6 } },
        scales: {
          y: { position: 'left', title: { display: true, text: 'NPS / L-NPS' }, suggestedMin: -100, suggestedMax: 100 },
        },
      },
    };
  } else if (config.tipo === 'barra-objeto') {
    const entradas = Object.entries(r.valor);
    configuracaoChart = {
      type: 'bar',
      data: {
        labels: entradas.map(([k]) => k),
        datasets: [{ label: r.nome, data: entradas.map(([, v]) => v), backgroundColor: PALETA_GRAFICO }],
      },
      options: { ...opcoesComuns, plugins: { legend: { display: false } } },
    };
  } else {
    let itens = [...r.valor];
    if (config.limite) itens = itens.slice(0, config.limite);
    const [chaveRotulo, chaveValor] = config.chaves;
    const rotulos = itens.map((i) => String(i[chaveRotulo]));
    const valores = itens.map((i) => i[chaveValor]);

    if (config.tipo === 'rosca' || config.tipo === 'pizza') {
      configuracaoChart = {
        type: config.tipo === 'pizza' ? 'pie' : 'doughnut',
        data: { labels: rotulos, datasets: [{ data: valores, backgroundColor: PALETA_GRAFICO }] },
        options: opcoesComuns,
      };
    } else {
      const horizontal = config.tipo === 'barra-h';
      configuracaoChart = {
        type: 'bar',
        data: { labels: rotulos, datasets: [{ label: r.nome, data: valores, backgroundColor: rotulos.map((_, i) => PALETA_GRAFICO[i % PALETA_GRAFICO.length]), borderRadius: 8, maxBarThickness: 64 }] },
        options: {
          ...opcoesComuns,
          indexAxis: horizontal ? 'y' : 'x',
          plugins: { legend: { display: false } },
          scales: { [horizontal ? 'x' : 'y']: { grid: { color: '#EDE8DA' } }, [horizontal ? 'y' : 'x']: { grid: { display: false } } },
        },
      };
    }
  }

  graficosAtivos[r.id] = new Chart(canvas, configuracaoChart);
}

/** Se o gráfico falhar por qualquer motivo, mostra a lista simples em vez de deixar a área em branco. */
function mostrarFallbackDeGrafico(r) {
  const container = document.getElementById(`grafico-container-${r.id}`);
  if (!container) return;
  container.outerHTML = Array.isArray(r.valor)
    ? `<ul class="lista-distribuicao">${r.valor.slice(0, 8).map(renderizarLinhaDistribuicao).join('')}</ul>`
    : `<ul class="lista-distribuicao">${Object.entries(r.valor).map(([k, v]) => `<li><span>${k}</span><span>${v}</span></li>`).join('')}</ul>`;
}

function destruirGraficos() {
  for (const chave of Object.keys(graficosAtivos)) {
    graficosAtivos[chave].destroy();
    delete graficosAtivos[chave];
  }
}

// ---------------------------------------------------------------------------
// Formatação (só apresentação, os números em si vêm prontos de metrics.js)
// ---------------------------------------------------------------------------

const IDS_PERCENTUAIS = new Set(['sla_fechamento', 'taxa_resposta_geral_pesquisas']);
const IDS_HORAS = new Set(['horas_por_colaborador', 'horas_por_colaborador_total']);
const IDS_DIAS = new Set(['sla_vagas_dias_medio', 'time_to_fill_medio', 'time_to_hire_medio', 'aging_medio']);

function formatarNumero(id, numero) {
  if (id === 'taxa_engajamento_media') {
    return `${(numero * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 })}%`;
  }
  const texto = numero.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
  if (IDS_PERCENTUAIS.has(id)) return `${texto}%`;
  if (IDS_HORAS.has(id)) return `${texto}h (${Math.round(numero * 60)}min)`;
  if (IDS_DIAS.has(id)) return `${texto}d`;
  return texto;
}

/**
 * Converte horas decimais em "Xh e Ymin" (ou só "Ymin" se for menos de 1h).
 * Pedido explícito: decimal tipo "0,7 horas" não é claro, 40min vira 40min,
 * não 0,7h.
 */
/** Data curta (dd/mm), lida em UTC pra não sofrer o mesmo problema de fuso que já corrigimos em outro lugar. */
function formatarDataCurta(data) {
  if (!(data instanceof Date)) return ',';
  return `${String(data.getUTCDate()).padStart(2, '0')}/${String(data.getUTCMonth() + 1).padStart(2, '0')}`;
}

function formatarHoraMinuto(horasDecimais) {
  if (typeof horasDecimais !== 'number' || Number.isNaN(horasDecimais)) return ',';
  const totalMinutos = Math.round(horasDecimais * 60);
  const horas = Math.floor(totalMinutos / 60);
  const minutos = totalMinutos % 60;
  if (horas === 0) return `${minutos}min`;
  if (minutos === 0) return `${horas}h`;
  return `${horas}h e ${minutos}min`;
}

function formatarDataHora(data) {
  return data.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

    ${secaoDev('Abas ignoradas', logAtual.abasIgnoradas.map((a) => `${a.aba}, ${a.motivo}`))}
    ${secaoDev('Contagem de linhas por aba', logAtual.contagemLinhas.map((c) => `${c.aba}: ${c.registrosReais} registro(s) real(is) de ${c.linhasNaPlanilha} linha(s) na planilha`))}
    ${secaoDev('Normalizações aplicadas', logAtual.normalizacoes.map((n) => `${n.contexto}: "${n.de}" → "${n.para}" (${n.ocorrencias}x)`))}
    ${secaoDev('Conflitos de coluna resolvidos', logAtual.conflitosColuna.map((c) => `${c.aba} > ${c.campo}: candidatas [${c.colunasCandidatas.join(', ')}] → escolhida "${c.colunaEscolhida}". ${c.motivo}`))}
    ${secaoDev('Colunas não reconhecidas', logAtual.colunasNaoReconhecidas.map((c) => `${c.aba} > campo "${c.campo}"`), 'erro')}
    ${secaoDev('Erros durante a leitura', logAtual.erros.map((e) => `${e.origem}: ${e.mensagem}`), 'erro')}
    ${secaoDev('Indicadores indisponíveis (estrutural, sem filtro)', validacaoAtual.indisponiveis.map((i) => `${i.id}, ${i.motivo}`), 'erro')}
    ${secaoDev('Indicadores aguardando dados (estrutural, sem filtro)', validacaoAtual.aguardandoDados.map((i) => `${i.id}, ${i.motivo}`), 'aviso')}
    ${secaoDev('Impacto por coluna faltante', validacaoAtual.impactoColunasFaltantes.map((i) => `"${i.nomeEsperado}" (${i.colecao}) afeta: ${i.indicadoresImpactados.join(', ') || 'nenhum indicador'}`), 'erro')}

      <div class="dev-linha">Cálculo de todos os indicadores (dado completo, sem filtro): ${validacaoAtual.tempoTotalMs} ms</div>
    </div>
  `;
}

function secaoDev(titulo, linhas, tipoTag) {
  const corpo = linhas.length
    ? linhas.map((l) => `<div class="dev-linha">${tipoTag ? `<span class="dev-tag ${tipoTag === 'erro' ? 'erro' : 'aviso'}">${tipoTag === 'erro' ? 'atenção' : 'aviso'}</span>` : ''}${l}</div>`).join('')
    : `<div class="dev-vazio">Nenhum registro.</div>`;
  return `<div class="dev-secao"><h3>${titulo}</h3>${corpo}</div>`;
}

// ---------------------------------------------------------------------------
// Dados pré-embutidos no próprio HTML
// ---------------------------------------------------------------------------

function desserializarComDatas(texto) {
  return JSON.parse(texto, (chave, valor) => {
    if (valor && typeof valor === 'object' && valor.__tipo === 'Date') return new Date(valor.iso);
    return valor;
  });
}

function carregarDadosPreEmbutidos() {
  const elPreload = document.getElementById('dados-preload');
  if (!elPreload || !elPreload.textContent.trim()) return;
  try {
    const preload = desserializarComDatas(elPreload.textContent);
    aplicarNovosDados(preload.dados, preload.log, preload.geradoEm ? new Date(preload.geradoEm) : new Date());
  } catch (erro) {
    console.error('Falha ao carregar os dados pré-embutidos no HTML:', erro);
  }
}

carregarDadosPreEmbutidos();
